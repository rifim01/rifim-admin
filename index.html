<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>

<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<meta name="theme-color" content="#090910"/>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"/>

<title>RIFIM Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet"/>

<style>

:root{
  --clr-primary:#E53935;
  --clr-primary-dim:rgba(229,57,53,.15);

  --srf-bg:#090910;
  --srf-0:#0F0F17;
  --srf-1:#14141E;
  --srf-2:#1A1A25;
  --srf-3:#20202D;

  --txt-pri:#F1EFF8;
  --txt-sec:#A8A4B8;
  --txt-dis:#5A5770;

  --out-var:rgba(255,255,255,.07);
  --out:rgba(255,255,255,.13);

  --clr-ok:#00E676;
  --clr-warn:#FFD740;
  --clr-err:#FF5252;
  --clr-info:#40C4FF;

  --r-xs:8px;
  --r-sm:12px;
  --r-md:16px;
  --r-lg:24px;
  --r-xl:32px;
  --r-full:100px;

  --nav-h:64px;

  --sfi:env(safe-area-inset-bottom,0px);
  --sft:env(safe-area-inset-top,0px);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  height:100%;
  overflow:hidden;
  background:var(--srf-bg);
}

body{
  font-family:"Google Sans Text","Google Sans",sans-serif;
  background:var(--srf-bg);
  color:var(--txt-pri);
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:url("assets/bg.jpg") center/cover no-repeat;
  opacity:.10;
}

#loading{
  position:fixed;
  inset:0;
  background:#090910;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loader{
  width:70px;
  height:70px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.08);
  border-top:4px solid #E53935;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading-text{
  margin-top:20px;
  font-size:14px;
  color:#A8A4B8;
  letter-spacing:1px;
}

#app{
  display:none;
  height:100%;
}

.topbar{
  height:60px;
  background:rgba(10,10,20,.92);
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:38px;
  height:38px;
  border-radius:12px;
  object-fit:cover;
}

.logo h1{
  font-size:18px;
  font-family:"Google Sans";
}

.content{
  padding:20px;
  overflow-y:auto;
  height:calc(100% - 60px);
}

.card{
  background:rgba(20,20,30,.80);
  border:1px solid rgba(255,255,255,.06);
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
}

.card-title{
  font-size:14px;
  color:#A8A4B8;
  margin-bottom:14px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.btn{
  height:48px;
  border:none;
  border-radius:16px;
  padding:0 20px;
  cursor:pointer;
  background:linear-gradient(135deg,#E53935,#B71C1C);
  color:white;
  font-weight:700;
  font-family:"Google Sans";
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.input{
  width:100%;
  height:48px;
  background:#1A1A25;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  padding:0 14px;
  color:white;
  outline:none;
  margin-bottom:12px;
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00E676;
  box-shadow:0 0 8px #00E676;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#1A1A25;
  color:#A8A4B8;
  font-size:11px;
  text-transform:uppercase;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:13px;
}

@media(max-width:700px){

  .content{
    padding:14px;
  }

  .logo h1{
    font-size:15px;
  }

}

</style>
</head>

<body>

<div id="loading">

  <div class="loader"></div>

  <div class="loading-text">
    Loading RIFIM Admin...
  </div>

</div>

<div id="app">

  <div class="topbar">

    <div class="logo">

      <img src="assets/logo.png"/>

      <h1>RIFIM Admin</h1>

    </div>

    <button class="btn" onclick="logout()">
      Logout
    </button>

  </div>

  <div class="content">

    <div class="card">

      <div class="card-title">
        Dashboard
      </div>

      <div class="status">
        <div class="dot"></div>
        <div>
          Sistem aktif & terkoneksi
        </div>
      </div>

    </div>

    <div class="card">

      <div class="card-title">
        Login
      </div>

      <input class="input" id="username" placeholder="Username"/>

      <input class="input" id="password" type="password" placeholder="Password"/>

      <button class="btn" onclick="login()">
        Masuk Sistem
      </button>

    </div>

    <div class="card">

      <div class="card-title">
        Data Driver
      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>Nama</th>
              <th>Cabang</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="tableBody">

            <tr>
              <td>DRV001</td>
              <td>Bobby Rahman</td>
              <td>Batam</td>
              <td style="color:#00E676;font-weight:700;">
                AKTIF
              </td>
            </tr>

            <tr>
              <td>DRV002</td>
              <td>Govinda</td>
              <td>Jambi</td>
              <td style="color:#FFD740;font-weight:700;">
                OFFLINE
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script>

window.addEventListener("load",()=>{

  setTimeout(()=>{

    document.getElementById("loading").style.display="none";

    document.getElementById("app").style.display="block";

  },1500);

});

function login(){

  const user=document.getElementById("username").value;
  const pass=document.getElementById("password").value;

  if(user==="admin" && pass==="admin"){

    alert("Login berhasil");

  }else{

    alert("Username atau password salah");

  }

}

function logout(){

  alert("Logout berhasil");

}

</script>

</body>
</html>
