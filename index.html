<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RIFIM ERP — PT. Rifim International Gemilang</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box}
.mono{font-family:'JetBrains Mono',monospace}
:root{--red:#C62828;--red2:#B71C1C;--red3:#FFEBEE;--slate:#37474F;--slate2:#263238;--bg:#F3F4F8;--card:#FFFFFF;--border:#E2E8F0;--text:#1E293B;--text2:#64748B}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:99px}
.fade{animation:fu .2s ease}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.side-btn{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;color:#64748B;cursor:pointer;transition:all .15s;width:100%;text-align:left;border:none;background:transparent}
.side-btn:hover{background:#F1F5F9;color:#1E293B}
.side-btn.active{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(198,40,40,.25)}
.side-btn .icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:rgba(255,255,255,.15)}
.side-btn:not(.active) .icon{background:#F1F5F9}
.card{background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-premium{background:#fff;border-radius:16px;border:1px solid var(--border);box-shadow:0 2px 16px rgba(0,0,0,.07)}
.inp{width:100%;font-size:13px;border:1.5px solid #E2E8F0;border-radius:10px;padding:9px 12px;background:#F8FAFC;transition:all .15s;outline:none}
.inp:focus{background:#fff;border-color:var(--red);box-shadow:0 0 0 3px rgba(198,40,40,.08)}
.btn-red{background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:9px 18px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;box-shadow:0 2px 8px rgba(198,40,40,.25)}
.btn-red:hover{background:var(--red2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(198,40,40,.35)}
.btn-red:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-gray{background:#F1F5F9;color:#475569;font-weight:600;font-size:13px;padding:9px 16px;border-radius:10px;border:1.5px solid #E2E8F0;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.btn-gray:hover{background:#E2E8F0}
.btn-blue{background:#1565C0;color:#fff;font-weight:700;font-size:13px;padding:9px 18px;border-radius:10px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.3px}
.badge-ok{background:#DCFCE7;color:#15803D;border:1px solid #BBF7D0}
.badge-err{background:#FEE2E2;color:#DC2626;border:1px solid #FECACA}
.badge-warn{background:#FEF9C3;color:#A16207;border:1px solid #FEF08A}
.badge-blue{background:#DBEAFE;color:#1D4ED8;border:1px solid #BFDBFE}
.th{padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#94A3B8;text-align:left}
.td{padding:10px 12px;font-size:13px;color:#374151;vertical-align:middle}
.tr-hover:hover{background:#FAFAFA}
.stat-card{padding:20px;border-radius:14px;border:1px solid var(--border)}
.section-title{font-size:15px;font-weight:800;color:#1E293B;margin-bottom:4px}
.section-sub{font-size:12px;color:#94A3B8;font-weight:500}
/* TABLE STICKY HEADER */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1.5px solid #E2E8F0}
.tbl-wrap table{width:100%;border-collapse:collapse;min-width:900px}
.tbl-wrap thead{background:#1E293B;position:sticky;top:0;z-index:1}
.tbl-wrap thead th{color:#CBD5E1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:11px 12px;text-align:left;white-space:nowrap}
.tbl-wrap tbody tr{border-bottom:1px solid #F1F5F9;transition:background .1s}
.tbl-wrap tbody tr:hover{background:#FAFBFF}
.tbl-wrap td{padding:9px 12px;font-size:12.5px;color:#374151;vertical-align:middle;white-space:nowrap}
/* LOGIN */
.login-bg{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
</style>
</head>

  function open(){return new Promise((r,j)=>{if(_db)return r(_db);const q=indexedDB.open(N,1);q.onupgradeneeded=e=>e.target.result.createObjectStore(S);q.onsuccess=e=>{_db=e.target.result;r(_db)};q.onerror=()=>j(q.error)})}
  async function iGet(k){try{const db=await open();return new Promise((r,j)=>{const q=db.transaction(S,"readonly").objectStore(S).get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>j(q.error)})}catch{return null}}
  async function iSet(k,v){try{const db=await open();await new Promise((r,j)=>{const q=db.transaction(S,"readwrite").objectStore(S).put(v,k);q.onsuccess=r;q.onerror=()=>j(q.error)})}catch{}}
  const subs=[];
  return{
    get:iGet,
    set:async(k,v)=>{await iSet(k,v);try{localStorage.setItem(k,JSON.stringify(v))}catch{};subs.forEach(f=>{try{f(k,v)}catch{}})},
    subscribe:(f)=>{subs.push(f);return()=>{const i=subs.indexOf(f);if(i>-1)subs.splice(i,1)}}
  }
})();

// GAS FETCH
async function gasGet(params){
  const p=new URLSearchParams(params);
  const r=await fetch(GAS+"?"+p.toString());
  return r.json();
}

// ── TOAST ────────────────────────────────────────────────────────────────────
function Toast({toasts,remove}){
  const colors={success:"#15803D",error:"#DC2626",info:"#1D4ED8",warn:"#D97706"};
  const icons={success:"✅",error:"❌",info:"ℹ️",warn:"⚠️"};
  return(
    <div style={{position:"fixed",bottom:24,right:24,zIndex:9999,display:"flex",flexDirection:"column",gap:8}}>
      {toasts.map(t=>(
        <div key={t.id} className="fade" style={{background:"#1E293B",border:`1.5px solid ${colors[t.type]||colors.info}40`,borderLeft:`4px solid ${colors[t.type]||colors.info}`,borderRadius:12,padding:"12px 16px",color:"#F1F5F9",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:10,boxShadow:"0 8px 32px rgba(0,0,0,.3)",maxWidth:320}}>
          <span style={{fontSize:16}}>{icons[t.type]||"ℹ️"}</span>
          <span style={{flex:1}}>{t.msg}</span>
          <button onClick={()=>remove(t.id)} style={{background:"none",border:"none",color:"#64748B",cursor:"pointer",fontSize:14}}>✕</button>
        </div>
      ))}
    </div>
  )
}

// ── SAL INPUT DOCK ───────────────────────────────────────────────────────────
function SalDock({toast}){
  const EMPTY=()=>({credit:"",sum:"",tgl:""});
  const [lines,setLines]=useState(Array.from({length:10},EMPTY));
  const [rows,setRows]=useState([]);
  const [dockNo,setDockNo]=useState("1");
  const [sending,setSending]=useState(false);
  const [results,setResults]=useState([]);
  const [dbDriver,setDbDriver]=useState({});
  const [dbLoading,setDbLoading]=useState(false);

  useEffect(()=>{
    setDbLoading(true);
    gasGet({action:"dbdriver"}).then(d=>{
      if(d.success&&d.data)setDbDriver(d.data);
      setDbLoading(false);
    }).catch(()=>setDbLoading(false));
  },[]);

  function updateLine(idx,key,val){
    setLines(prev=>{
      const next=[...prev];
      next[idx]={...next[idx],[key]:val};
      if(key==="credit"){
        const m=val.match(/^(\d{6,12})(?::\s*(.+))?$/);
        if(m){
          const lid=m[1].trim();
          const db=dbDriver[lid];
          if(db) next[idx]={...next[idx],_lid:lid,_nama:db.nama,_cab:db.cabang,_ok:true};
          else next[idx]={...next[idx],_lid:lid,_nama:m[2]?.trim()||"",_cab:"",_ok:false};
        } else {
          next[idx]={...next[idx],_lid:"",_nama:"",_cab:"",_ok:false};
        }
      }
      return next;
    });
  }

  function handleParse(){
    if(dbLoading){toast("Tunggu DB Driver loading...","warn");return}
    const out=[];
    lines.forEach((l,i)=>{
      if(!l.credit.trim()&&!l.sum.trim()) return;
      const mc=l.credit.match(/^(\d{6,12})(?::\s*(.+))?$/);
      if(!mc){toast("Baris "+(i+1)+": Format Credit Account salah","error");return}
      const loginId=mc[1].trim();
      const rawNom=l.sum.replace(/\s/g,"").replace(/\./g,"").replace(/,/g,"");
      const sum=parseInt(rawNom)||0;
      if(!sum){toast("Baris "+(i+1)+": SUM tidak valid","error");return}
      let tglDisp=l.tgl.trim();
      if(tglDisp){
        if(!/^\d{2}\.\d{2}\.\d{4}\s+\d{2}:\d{2}:\d{2}$/.test(tglDisp)){
          toast("Baris "+(i+1)+": Format tanggal salah (dd.MM.yyyy HH:mm:ss)","error");return;
        }
      } else {
        const n=new Date();
        tglDisp=[String(n.getDate()).padStart(2,"0"),String(n.getMonth()+1).padStart(2,"0"),n.getFullYear()].join(".")+" "+[String(n.getHours()).padStart(2,"0"),String(n.getMinutes()).padStart(2,"0"),String(n.getSeconds()).padStart(2,"0")].join(":");
      }
      const db=dbDriver[loginId]||{};
      const nama=l._nama||db.nama||mc[2]?.trim()||"-";
      const cabang=l._cab||db.cabang||CABANG[0];
      out.push({loginId,nama,sum,nomTag:nomTagihan(sum),tglDisp,cabang});
    });
    if(!out.length){toast("Tidak ada baris yang terisi","error");return}
    setRows(out);setResults([]);
    toast(out.length+" transaksi siap!","success");
  }

  async function handleKirim(){
    if(!rows.length){toast("Tidak ada data!","error");return}
    setSending(true);const res=[];
    for(const r of rows){
      try{
        const d=await gasGet({action:"input_dock_row",tanggal:r.tglDisp,sum:r.sum,credit:r.loginId+": "+r.nama,loginId:r.loginId,nomTagihan:r.nomTag,nama:r.nama,cabang:r.cabang,dock:dockNo});
        res.push({...r,result:d.success?"✅ DONE":"❌ "+(d.error||"Error")});
      }catch(e){res.push({...r,result:"❌ "+e.message})}
    }
    setResults(res);setRows([]);setSending(false);
    setLines(Array.from({length:10},EMPTY));
    const ok=res.filter(r=>r.result.startsWith("✅")).length;
    toast(ok+"/"+res.length+" berhasil!",ok===res.length?"success":"error");
  }

  const totalSum=rows.reduce((s,r)=>s+r.sum,0);
  const totalTag=rows.reduce((s,r)=>s+r.nomTag,0);
  const filled=lines.filter(l=>l.credit.trim()||l.sum.trim()).length;

  return(
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:20}}>
      <div className="card-premium" style={{padding:"20px 24px"}}>
        {/* TOP BAR */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:44,height:44,borderRadius:12,background:"var(--red)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:20,fontWeight:900}}>S</div>
            <div>
              <div style={{fontSize:16,fontWeight:800}}>SAL Input Dock</div>
              <div style={{fontSize:12,color:"#94A3B8",marginTop:1}}>{dbLoading?"⏳ Memuat DB Driver...":"✅ DB Driver: "+Object.keys(dbDriver).length+" driver"}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <a href={"https://docs.google.com/spreadsheets/d/"+SAL_ID+"/edit"} target="_blank" className="btn-gray" style={{fontSize:12}}>📊 Sheet</a>
            <a href={DRIVE_ROOT} target="_blank" className="btn-gray" style={{fontSize:12}}>📁 Drive</a>
          </div>
        </div>
        {/* CONTROLS */}
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,padding:"10px 14px",background:"#F8FAFC",borderRadius:10,border:"1px solid #E2E8F0",flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:12,fontWeight:700,color:"#64748B"}}>DOCK #</span>
            <select value={dockNo} onChange={e=>setDockNo(e.target.value)} style={{border:"1.5px solid #E2E8F0",borderRadius:8,padding:"5px 10px",fontSize:13,fontWeight:600,outline:"none"}}>
              <option value="1">Dock 1</option><option value="2">Dock 2</option><option value="3">Dock 3</option>
            </select>
          </div>
          <span style={{color:"#CBD5E1"}}>|</span>
          <span style={{fontSize:12,color:"#94A3B8"}}>{filled} baris terisi dari {lines.length}</span>
          <div style={{marginLeft:"auto",display:"flex",gap:8}}>
            <button onClick={()=>{setLines(Array.from({length:10},EMPTY));setRows([]);setResults([])}} className="btn-gray" style={{fontSize:12,padding:"7px 14px"}}>↺ Reset</button>
            <button onClick={()=>setLines(p=>[...p,EMPTY()])} className="btn-gray" style={{fontSize:12,padding:"7px 14px"}}>+ Baris</button>
            <button onClick={handleParse} className="btn-red" style={{padding:"7px 18px"}}>▶ Proses{filled>0?" ("+filled+")":""}</button>
          </div>
        </div>
        {/* INPUT GRID — 1 baris = 1 transaksi */}
        <div className="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th style={{width:32,textAlign:"center"}}>#</th>
                <th style={{width:240}}>Credit Account</th>
                <th style={{width:110,textAlign:"right"}}>SUM</th>
                <th style={{width:180}}>Tanggal (dd.MM.yyyy HH:mm:ss)</th>
                <th style={{width:90,textAlign:"right"}}>Tagihan</th>
                <th style={{width:160}}>Nama Driver</th>
                <th>ID Cabang</th>
                <th style={{width:28}}></th>
              </tr>
            </thead>
            <tbody>
              {lines.map((l,i)=>{
                const has=l.credit.trim()||l.sum.trim();
                const s=parseInt(l.sum.replace(/\s/g,"").replace(/\./g,"").replace(/,/g,""))||0;
                const bg=!has?"#fff":l._ok?"#F0FFF4":l._lid?"#FFFDE7":"#fff";
                return(
                  <tr key={i} style={{background:bg}}>
                    <td style={{textAlign:"center",color:"#94A3B8",fontWeight:700,fontSize:11}}>{i+1}</td>
                    <td><input value={l.credit} onChange={e=>updateLine(i,"credit",e.target.value)} placeholder="204910728: Nama Driver" className="mono" style={{width:"100%",fontSize:11,border:"none",background:"transparent",outline:"none",padding:"4px 6px"}}/></td>
                    <td><input value={l.sum} onChange={e=>updateLine(i,"sum",e.target.value)} placeholder="95 000" className="mono" style={{width:"100%",fontSize:12,border:"none",background:"transparent",outline:"none",padding:"4px 6px",textAlign:"right"}}/></td>
                    <td><input value={l.tgl} onChange={e=>updateLine(i,"tgl",e.target.value)} placeholder="31.05.2026 13:52:16" className="mono" style={{width:"100%",fontSize:11,border:"none",background:"transparent",outline:"none",padding:"4px 6px"}}/></td>
                    <td style={{textAlign:"right",fontWeight:700,color:"var(--red)",fontSize:12}}>{s>0?rp(nomTagihan(s)):"—"}</td>
                    <td style={{fontSize:11,color:l._ok?"#15803D":l._lid?"#D97706":"#94A3B8",fontWeight:l._ok?700:400}}>
                      {l._nama||""}{l._lid&&!l._ok&&<span style={{fontSize:9,marginLeft:4}}>⚠️</span>}
                    </td>
                    <td style={{fontSize:10,color:"#64748B"}}>{l._cab||""}</td>
                    <td><button onClick={()=>setLines(p=>p.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:"#E2E8F0",cursor:"pointer",fontSize:13}} onMouseOver={e=>e.target.style.color="#DC2626"} onMouseOut={e=>e.target.style.color="#E2E8F0"}>✕</button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:8,fontSize:10,color:"#94A3B8",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0 4px"}}>
          <span>🟢 Nama ditemukan otomatis &nbsp;🟡 ID dikenal, nama manual &nbsp;⚠️ Tidak ada di DB Driver</span>
          <button onClick={()=>setLines(p=>[...p,EMPTY()])} style={{background:"none",border:"1px dashed #CBD5E1",borderRadius:6,padding:"3px 10px",fontSize:10,color:"#94A3B8",cursor:"pointer"}}>+ Tambah Baris</button>
        </div>
      </div>
      {/* TABEL PREVIEW — baris lurus seperti spreadsheet */}
      {rows.length>0&&(
        <div className="card-premium" style={{padding:"20px 24px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:12}}>
            <div>
              <div style={{fontSize:15,fontWeight:800}}>Preview — {rows.length} Transaksi</div>
              <div style={{fontSize:12,color:"#64748B",marginTop:2}}>ID Cabang otomatis dari DB Driver • Edit jika perlu</div>
            </div>
            <button onClick={handleKirim} disabled={sending} className="btn-red">
              {sending?"⏳ Mengirim...":"📤 Kirim ke Spreadsheet"}
            </button>
          </div>
          <div className="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Tanggal</th><th>Login ID</th><th>Credit Account</th>
                  <th>SUM</th><th>Nominal Tagihan</th><th>Nama Driver</th><th>ID Cabang</th><th></th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i)=>(
                  <tr key={i} className="tr-hover">
                    <td style={{color:"#94A3B8",width:36}}>{i+1}</td>
                    <td className="mono" style={{fontSize:11}}>{r.tglDisp}</td>
                    <td className="mono" style={{fontWeight:700,color:"#1E293B"}}>{r.loginId}</td>
                    <td style={{color:"#64748B",fontSize:11}}>{r.loginId}: {r.nama}</td>
                    <td style={{textAlign:"right",fontWeight:600}} className="mono">{rp(r.sum)}</td>
                    <td style={{textAlign:"right",fontWeight:700,color:"var(--red)"}} className="mono">{rp(r.nomTag)}</td>
                    <td>
                      <input value={r.nama} onChange={e=>setRows(p=>p.map((x,j)=>j===i?{...x,nama:e.target.value}:x))} style={{width:140,fontSize:12,border:"1.5px solid #E2E8F0",borderRadius:7,padding:"5px 8px",outline:"none"}}/>
                    </td>
                    <td>
                      <select value={r.cabang} onChange={e=>setRows(p=>p.map((x,j)=>j===i?{...x,cabang:e.target.value}:x))} style={{fontSize:11,border:"1.5px solid #E2E8F0",borderRadius:7,padding:"5px 8px",outline:"none",width:200}}>
                        {CABANG.map(c=><option key={c}>{c}</option>)}
                      </select>
                    </td>
                    <td><button onClick={()=>setRows(p=>p.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",fontSize:16}}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {/* Ringkasan */}
          <div style={{display:"flex",gap:24,marginTop:12,paddingTop:12,borderTop:"1px solid #F1F5F9",flexWrap:"wrap"}}>
            <div style={{fontSize:12,color:"#64748B"}}>Total transaksi: <strong style={{color:"#1E293B"}}>{rows.length}</strong></div>
            <div style={{fontSize:12,color:"#64748B"}}>Total SUM: <strong style={{color:"#1D4ED8"}}>{rp(totalSum)}</strong></div>
            <div style={{fontSize:12,color:"#64748B"}}>Total Tagihan: <strong style={{color:"var(--red)"}}>{rp(totalTag)}</strong></div>
            <div style={{fontSize:12,color:"#64748B"}}>Selisih Tagihan: <strong style={{color:"#15803D"}}>{rp(totalTag-totalSum)}</strong></div>
          </div>
        </div>
      )}

      {/* Hasil */}
      {results.length>0&&(
        <div className="card-premium" style={{padding:"20px 24px"}}>
          <div style={{fontSize:15,fontWeight:800,marginBottom:12}}>
            Hasil — {results.filter(r=>r.result.startsWith("✅")).length}/{results.length} Berhasil
          </div>
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>#</th><th>Login ID</th><th>Nama</th><th>Cabang</th><th>SUM</th><th>Tagihan</th><th>Status</th></tr></thead>
              <tbody>
                {results.map((r,i)=>(
                  <tr key={i} style={{background:r.result.startsWith("✅")?"#F0FDF4":"#FEF2F2"}}>

                    <td><span className={r.result.startsWith("✅")?"badge badge-ok":"badge badge-err"}>{r.result.startsWith("✅")?"DONE":"ERROR"}</span></td>
                  </tr>

// ── GENERATE INVOICE ─────────────────────────────────────────────────────────
function GenInvoice({toast}){
  const [cab,setCab]=useState(CABANG[0]);
  const [jenis,setJenis]=useState("TAGIHAN_CABANG");
  const [tgl,setTgl]=useState(today());
  const [loading,setLoading]=useState(false);
  const [loadAll,setLoadAll]=useState(false);
  const [hasil,setHasil]=useState(null);
  const [allRes,setAllRes]=useState([]);

  async function gen(){
    setLoading(true);setHasil(null);
    try{const d=await gasGet({action:"generate",cabang:cab,tanggal:tgl,jenis});setHasil(d);if(d.success)toast("Invoice dibuat!","success");else toast(d.error,"error")}
    catch(e){toast(e.message,"error")}
    setLoading(false);
  }
  async function genAll(){
    setLoadAll(true);setAllRes([]);
    try{const d=await gasGet({action:"generate_all",tanggal:tgl,jenis});const arr=Array.isArray(d)?d:[d];setAllRes(arr);const ok=arr.filter(x=>x.success).length;toast(`${ok}/${arr.length} invoice dibuat!`,ok===arr.length?"success":"warn")}
    catch(e){toast(e.message,"error")}
    setLoadAll(false);
  }

  return(
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:20}}>
      <div className="card-premium" style={{padding:"24px"}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:24}}>

          <div>
            <div style={{fontSize:16,fontWeight:800}}>Generate Invoice PDF</div>
            <div style={{fontSize:12,color:"#94A3B8",marginTop:2}}>Data ditarik dari DB_TRANSAKSI berdasarkan tanggal & cabang</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:20}}>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",marginBottom:6}}>Cabang</div>

            <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",marginBottom:6}}>Jenis Invoice</div>

// ── LAPORAN HARIAN ───────────────────────────────────────────────────────────
function LaporanHarian({refresh}){
  const [chk,setChk]=useState([]);
  const [fTgl,setFTgl]=useState(today());
  useEffect(()=>{DB.get("rifim_chk").then(x=>{if(x)setChk(x)});},[refresh]);
  const filtered=useMemo(()=>chk.filter(x=>x.tgl===fTgl),[chk,fTgl]);
  const byAdmin=useMemo(()=>{
    const m={};chk.forEach(x=>{if(!m[x.admin])m[x.admin]={n:0,tot:0};m[x.admin].n++;m[x.admin].tot+=x.pct||0});
    return Object.entries(m).map(([a,d])=>({admin:a,n:d.n,avg:Math.round(d.tot/d.n)})).sort((a,b)=>b.avg-a.avg);
  },[chk]);

  return(
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16}}>
        {[["Total Checklist",chk.length,"📋","#1565C0"],["Hari Ini",filtered.length,"🗓️","#15803D"],["Rata-rata",byAdmin.length>0?Math.round(byAdmin.reduce((s,x)=>s+x.avg,0)/byAdmin.length)+"%":"—%","📊","var(--red)"]].map(([l,v,ic,c])=>(
          <div key={l} className="card-premium" style={{padding:20}}>
            <div style={{fontSize:24,marginBottom:8}}>{ic}</div>
            <div style={{fontSize:28,fontWeight:900,color:c}}>{v}</div>
            <div style={{fontSize:12,color:"#94A3B8",fontWeight:600,marginTop:4}}>{l}</div>
          </div>
        ))}
      </div>
      <div className="card-premium" style={{padding:"20px 24px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div style={{fontSize:15,fontWeight:800}}>Kinerja Admin</div>
          <input type="date" value={fTgl} onChange={e=>setFTgl(e.target.value)} className="inp" style={{width:160}}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {byAdmin.length===0?<div style={{textAlign:"center",color:"#94A3B8",padding:"32px 0",fontSize:13}}>Belum ada data checklist</div>:
          byAdmin.map(p=>(
            <div key={p.admin} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:"#F8FAFC",borderRadius:12,border:"1.5px solid #E2E8F0"}}>
              <div style={{width:36,height:36,borderRadius:10,background:"var(--red)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:14,fontWeight:900}}>{p.admin[0]}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700}}>{p.admin}</div>
                <div style={{fontSize:11,color:"#94A3B8"}}>{p.n} checklist</div>
              </div>
              <div style={{width:120,background:"#E2E8F0",borderRadius:99,height:6,overflow:"hidden"}}>
                <div style={{width:`${p.avg}%`,height:"100%",background:p.avg>=85?"#15803D":p.avg>=60?"#D97706":"#DC2626",borderRadius:99,transition:"width .5s"}}/>
              </div>
              <div style={{fontSize:18,fontWeight:900,width:50,textAlign:"right",color:p.avg>=85?"#15803D":p.avg>=60?"#D97706":"#DC2626"}}>{p.avg}%</div>
            </div>
          ))}
        </div>
      </div>
      {filtered.length>0&&(
        <div className="card-premium" style={{padding:"20px 24px"}}>
          <div style={{fontSize:15,fontWeight:800,marginBottom:14}}>Detail {fmtD(fTgl)}</div>
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>#</th><th>Admin</th><th>Shift</th><th>Cabang</th><th>Masuk</th><th>Keluar</th><th>Progress</th><th>Kendala</th></tr></thead>
              <tbody>
                {filtered.map((h,i)=>(
                  <tr key={h.id}>
                    <td style={{color:"#94A3B8"}}>{i+1}</td>
                    <td style={{fontWeight:700}}>{h.admin}</td>
                    <td><span className="badge badge-blue">{h.shift}</span></td>
                    <td style={{fontSize:11}}>{h.cab}</td>
                    <td className="mono">{h.ti||"-"}</td>
                    <td className="mono">{h.to||"-"}</td>
                    <td><span className={`badge ${h.pct>=85?"badge-ok":h.pct>=60?"badge-warn":"badge-err"}`}>{h.pct}%</span></td>
                    <td style={{fontSize:11,color:"#64748B",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis"}}>{h.kdl||"-"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  )
}

// ── CHECKLIST ────────────────────────────────────────────────────────────────
function Checklist({toast,refresh}){
  const [hist,setHist]=useState([]);
  const [form,setForm]=useState({tgl:today(),admin:"Govind",shift:"Pagi",cab:CABANG[0],ti:"",to:"",t:{},kdl:"",ss:""});
  useEffect(()=>{DB.get("rifim_chk").then(x=>{if(x)setHist(x)});},[refresh]);
  const done=Object.values(form.t).filter(Boolean).length;
  const pct=Math.round((done/TASKS.length)*100);
  const save=()=>{
    const item={...form,id:genId("CHK"),pct,ts:new Date().toISOString()};
    const u=[item,...hist];setHist(u);DB.set("rifim_chk",u);
    toast("Checklist disimpan!","success");
    setForm(p=>({...p,ti:"",to:"",t:{},kdl:"",ss:""}));
  };

  return(
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:20}}>
      <div className="card-premium" style={{padding:24}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:20}}>Isi Checklist Harian</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:14,marginBottom:20}}>
          {[["Tanggal","tgl","date"],["Admin","admin","select",["Govind","Tasya","Abel"]],["Shift","shift","select",["Pagi","Siang"]],["Jam Masuk","ti","time"]].map(([l,k,t,opts])=>(
            <div key={k}>
              <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",marginBottom:6}}>{l}</div>
              {t==="select"?<select value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} className="inp">{opts.map(o=><option key={o}>{o}</option>)}</select>:<input type={t} value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} className="inp"/>}
            </div>
          ))}
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",marginBottom:6}}>Cabang</div>
          <select value={form.cab} onChange={e=>setForm({...form,cab:e.target.value})} className="inp">
            {CABANG.map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <div style={{marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase"}}>Progress Tugas</div>
            <div style={{fontSize:13,fontWeight:800,color:pct>=85?"#15803D":pct>=60?"#D97706":"var(--red)"}}>{done}/{TASKS.length} — {pct}%</div>
          </div>
          <div style={{height:8,background:"#F1F5F9",borderRadius:99,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${pct}%`,background:pct>=85?"#15803D":pct>=60?"#D97706":"var(--red)",borderRadius:99,transition:"width .4s"}}/>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
          {TASKS.map(t=>(
            <label key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",borderRadius:10,border:`1.5px solid ${form.t[t.id]?"var(--red)":"#E2E8F0"}`,background:form.t[t.id]?"#FFF5F5":"#F8FAFC",cursor:"pointer",fontSize:12,fontWeight:600,color:form.t[t.id]?"var(--red)":"#475569",transition:"all .15s"}}>
              <input type="checkbox" checked={!!form.t[t.id]} onChange={e=>setForm(p=>({...p,t:{...p.t,[t.id]:e.target.checked}}))} style={{accentColor:"var(--red)"}}/>{t.lbl}
            </label>
          ))}
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",marginBottom:6}}>Kendala</div>
          <input type="text" placeholder="Tulis kendala hari ini..." value={form.kdl} onChange={e=>setForm({...form,kdl:e.target.value})} className="inp"/>
        </div>
        <button onClick={save} className="btn-red">💾 Simpan Checklist</button>
      </div>
      {hist.slice(0,5).map(h=>(
        <div key={h.id} className="card" style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:40,height:40,borderRadius:10,background:"var(--red)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:14,fontWeight:900,flexShrink:0}}>{h.admin[0]}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:13,fontWeight:700}}>{h.admin} — <span style={{color:"#64748B"}}>{h.shift}</span></div>
            <div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>{fmtD(h.tgl)} • {h.cab}</div>
          </div>
          <span className={`badge ${h.pct>=85?"badge-ok":h.pct>=60?"badge-warn":"badge-err"}`}>{h.pct}%</span>
        </div>
      ))}
    </div>
  )
}

  const mark=(id)=>{const u={...fl,[id]:{ts:new Date().toISOString()}};setFl(u);DB.set("rifim_files",u);toast("Ditandai update!","success")};

  return(
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        <div className="card-premium" style={{padding:20}}>
          <div style={{fontSize:28,fontWeight:900,color:"var(--red)"}}>{upT}/{FILES.length}</div>
          <div style={{fontSize:12,color:"#94A3B8",marginTop:4,fontWeight:600}}>SHEETS TERUPDATE HARI INI</div>
          <div style={{marginTop:12,height:8,background:"#F1F5F9",borderRadius:99,overflow:"hidden"}}>

        </div>
      </div>
      <div className="card-premium" style={{padding:0,overflow:"hidden"}}>
        <div style={{padding:"16px 20px",borderBottom:"1px solid #F1F5F9"}}>
          <div style={{fontSize:15,fontWeight:800}}>Daftar File — {FILES.length} Sheets</div>
        </div>
        <div>
          {FILES.map(f=>{const done=fl[f.id]?.ts?.startsWith(td);return(
            <div key={f.id} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 20px",borderBottom:"1px solid #F8FAFC",background:done?"#F0FDF4":"#fff",transition:"background .2s"}}>
              <div style={{width:36,height:36,borderRadius:10,background:done?"#15803D":"#F1F5F9",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:13,color:done?"#fff":"#94A3B8",flexShrink:0}}>{f.id}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:700,color:"#1E293B"}}>{f.nm}</div>
                <div style={{fontSize:11,color:"#94A3B8"}}>{f.u} {fl[f.id]&&!done&&` • Update: ${fmtD(fl[f.id].ts)}`}</div>
              </div>
              <div style={{display:"flex",gap:10,alignItems:"center",flexShrink:0}}>
                <a href={f.lnk} target="_blank" style={{fontSize:12,color:"var(--red)",fontWeight:700,textDecoration:"none"}}>Buka ↗</a>
                {done?<span className="badge badge-ok">DONE</span>:<button onClick={()=>mark(f.id)} className="btn-red" style={{fontSize:12,padding:"6px 14px"}}>Tandai</button>}
              </div>
            </div>
          )})}
        </div>
      </div>
    </div>
  )
}

// ── TAGIHAN ──────────────────────────────────────────────────────────────────
function Tagihan({toast,refresh}){
  const [items,setItems]=useState([]);

    if(!form.kr||!form.nom){toast("Isi kreditor & nominal!","error");return}

    <div className="fade" style={{display:"flex",flexDirection:"column",gap:20}}>

          <div style={{display:"flex",justifyContent:"space-between",marginBottom:14}}>

              <div key={it.id} style={{display:"flex",alignItems:"center",gap:14,padding:"12px 16px",background:"#F8FAFC",borderRadius:12,border:"1.5px solid #E2E8F0"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700}}>{it.kr}</div>
                  <div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>{it.dd?fmtD(it.dd):"No deadline"}{it.notes&&` • ${it.notes}`}</div>
                </div>
                <div style={{fontSize:15,fontWeight:900,color:"var(--red)"}}>{rp(it.nom)}</div>
                <button onClick={()=>{if(confirm("Hapus?")){const u=items.filter(x=>x.id!==it.id);setItems(u);DB.set("rifim_tagihan",u)}}} style={{background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",fontSize:16}}>✕</button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  )
}

// ── OWNER DASHBOARD ──────────────────────────────────────────────────────────
function Owner({role}){
  const [unlocked,setUnlocked]=useState(role==="owner");
  const [pw,setPw]=useState("");
  const [err,setErr]=useState("");
  const tryUnlock=()=>{if(pw===OWNER_PASS)setUnlocked(true);else{setErr("Password salah!");setTimeout(()=>setErr(""),2500)}};
  if(!unlocked)return(
    <div style={{maxWidth:380,margin:"40px auto"}} className="fade">
      <div className="card-premium" style={{padding:32,textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:16}}>🔒</div>
        <div style={{fontSize:15,fontWeight:800,marginBottom:6}}>Owner Dashboard</div>
        <div style={{fontSize:12,color:"#94A3B8",marginBottom:20}}>Hanya untuk Direktur Utama</div>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryUnlock()} placeholder="Password owner..." className="inp" style={{marginBottom:12,textAlign:"center"}}/>
        {err&&<div style={{color:"var(--red)",fontSize:12,marginBottom:12,fontWeight:600}}>{err}</div>}
        <button onClick={tryUnlock} className="btn-red" style={{width:"100%",justifyContent:"center"}}>🔓 Buka</button>
      </div>
    </div>
  );
  return(
    <div className="fade" style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontSize:16,fontWeight:800}}>Owner Dashboard</div>
        <button onClick={()=>setUnlocked(false)} style={{background:"none",border:"1.5px solid #E2E8F0",borderRadius:8,padding:"6px 12px",fontSize:12,color:"#64748B",cursor:"pointer"}}>🔒 Kunci</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16}}>
        {[["7 Cabang","Aktif Beroperasi","🏢","var(--red)"],["300+","Driver Terdaftar","🚗","#1565C0"],["11","Invoice Bulan Ini","📄","#15803D"],["ACTIVE","Status Sistem","✅","#D97706"]].map(([v,l,ic,c])=>(
          <div key={l} className="card-premium" style={{padding:20}}>
            <div style={{fontSize:28,marginBottom:8}}>{ic}</div>
            <div style={{fontSize:24,fontWeight:900,color:c}}>{v}</div>
            <div style={{fontSize:11,color:"#94A3B8",fontWeight:600,marginTop:4,textTransform:"uppercase"}}>{l}</div>
          </div>
        ))}
      </div>
      <div className="card-premium" style={{padding:"20px 24px"}}>
        <div style={{fontSize:14,fontWeight:800,marginBottom:14}}>Cabang Aktif</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {CABANG.map(c=>(
            <div key={c} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"#F8FAFC",borderRadius:10,border:"1.5px solid #E2E8F0"}}>
              <div style={{fontSize:13,fontWeight:600,color:"#1E293B"}}>{c}</div>
              <span className="badge badge-ok">ACTIVE</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  )
}

// ── APP SHELL ─────────────────────────────────────────────────────────────────
const NAV=[
  {id:"sal",    lbl:"Database Saldo",    ic:"💰", cmp:SalDock},
  {id:"invoice",lbl:"Generate Invoice",  ic:"📄", cmp:GenInvoice},
  {id:"laporan",lbl:"Laporan Harian",    ic:"📊", cmp:LaporanHarian},
  {id:"chk",    lbl:"Checklist",         ic:"✅", cmp:Checklist},
  {id:"files",  lbl:"Monitor Files",     ic:"🗂️",  cmp:FilesMonitor},
  {id:"tagihan",lbl:"Tagihan",           ic:"🧾", cmp:Tagihan},
  {id:"owner",  lbl:"Owner",             ic:"👑", cmp:Owner},
];

function App(){
  const [role,setRole]=useState(null);
  const [active,setActive]=useState("sal");
  const [toasts,setToasts]=useState([]);
  const [refresh,setRefresh]=useState(0);
  const toast=useCallback((msg,type="info")=>{const id=Date.now();setToasts(p=>[...p,{id,msg,type}])},[]);
  const removeToast=useCallback(id=>setToasts(p=>p.filter(t=>t.id!==id)),[]);
  useEffect(()=>{const u=DB.subscribe(()=>setRefresh(p=>p+1));return()=>u()},[]);
  if(!role)return <Login onLogin={setRole}/>;
  const C=NAV.find(n=>n.id===active)?.cmp||SalDock;

  return(
    <div style={{display:"flex",minHeight:"100vh",background:"var(--bg)"}}>
      {/* SIDEBAR */}
      <aside style={{width:220,background:"#fff",borderRight:"1px solid #E2E8F0",display:"flex",flexDirection:"column",flexShrink:0,position:"sticky",top:0,height:"100vh",overflow:"hidden"}}>
        {/* Brand */}
        <div style={{padding:"18px 16px 14px",borderBottom:"1px solid #F1F5F9"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <img src={LOGO} alt="" style={{width:36,height:36,borderRadius:10,objectFit:"cover",boxShadow:"0 2px 8px rgba(0,0,0,.12)",flexShrink:0}}/>
            <div>
              <div style={{fontSize:13,fontWeight:900,color:"var(--red)",lineHeight:1.2}}>RIFIM ERP</div>
              <div style={{fontSize:9,color:"#94A3B8",lineHeight:1.3}}>PT. Rifim International</div>
            </div>
          </div>
        </div>
        {/* Nav */}
        <nav style={{flex:1,padding:"12px 10px",overflowY:"auto",display:"flex",flexDirection:"column",gap:2}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setActive(n.id)} className={`side-btn ${active===n.id?"active":""}`}>
              <span className="icon">{n.ic}</span>
              <span>{n.lbl}</span>
            </button>
          ))}
        </nav>
        {/* Footer */}
        <div style={{padding:"10px 14px",borderTop:"1px solid #F1F5F9"}}>
          <div style={{fontSize:10,color:"#94A3B8",fontWeight:600}}>{role==="owner"?"👑 Owner":"🔐 Admin"} • v6.0</div>
        </div>
      </aside>

      {/* MAIN */}
      <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
        {/* TOP BAR */}
        <header style={{background:"#fff",borderBottom:"1px solid #E2E8F0",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50,boxShadow:"0 1px 4px rgba(0,0,0,.04)"}}>
          <div>
            <div style={{fontSize:14,fontWeight:800,color:"#1E293B"}}>Sistem Admin Rifim</div>
            <div style={{fontSize:11,color:"#94A3B8"}}>ERP Management System</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:12,fontWeight:700,color:"#1E293B"}}>PT. Rifim International Gemilang</div>
              <div style={{fontSize:10,color:"#94A3B8"}}>Airport Operations & Administration</div>
            </div>
            <a href={DRIVE_ROOT} target="_blank" className="btn-gray" style={{fontSize:12,padding:"7px 14px"}}>📁 Drive</a>
            <button onClick={()=>setRole(null)} style={{background:"none",border:"1.5px solid #E2E8F0",borderRadius:8,padding:"7px 14px",fontSize:12,color:"#64748B",cursor:"pointer",fontWeight:600}}>Keluar</button>
          </div>
        </header>

        {/* CONTENT */}
        <main style={{flex:1,padding:"24px",maxWidth:1200,margin:"0 auto",width:"100%"}}>
          <C toast={toast} refresh={refresh} role={role}/>
        </main>

        <footer style={{textAlign:"center",fontSize:10,color:"#CBD5E1",padding:"12px",borderTop:"1px solid #F1F5F9",fontWeight:600,letterSpacing:".3px"}}>
          RIFIM ERP v6.0 • PT. Rifim International Gemilang • INTEGRITAS • INOVASI • KUALITAS • KEBERLANJUTAN
        </footer>
      </div>

      <Toast toasts={toasts} remove={removeToast}/>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
