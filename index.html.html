// Storage engine: IndexedDB (primary) + localStorage (fallback)
// Data persists across page refresh & browser restarts on Vercel
const appStorage = (() => {
  const DB_NAME = "rifim_v4_db";
  const STORE   = "kv";
  let _db = null;

  function openDB() {
    return new Promise((res, rej) => {
      if (_db) return res(_db);
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
      req.onsuccess = e => { _db = e.target.result; res(_db); };
      req.onerror   = () => rej(req.error);
    });
  }

  async function idbGet(k) {
    try {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx  = db.transaction(STORE, "readonly");
        const req = tx.objectStore(STORE).get(k);
        req.onsuccess = () => res(req.result ?? null);
        req.onerror   = () => rej(req.error);
      });
    } catch { return null; }
  }

  async function idbSet(k, v) {
    try {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx  = db.transaction(STORE, "readwrite");
        const req = tx.objectStore(STORE).put(v, k);
        req.onsuccess = () => res();
        req.onerror   = () => rej(req.error);
      });
    } catch {}
  }

  return {
    listeners: [],
    subscribe(l) { this.listeners.push(l); return () => { this.listeners = this.listeners.filter(x => x !== l); }; },
    notify(k, v) { this.listeners.forEach(l => { try { l(k, v); } catch(e) {} }); },
    async get(k) {
      try {
        // Try IndexedDB first
        const v = await idbGet(k);
        if (v !== null) return v;
        // Fallback: localStorage
        const ls = localStorage.getItem(k);
        return ls ? JSON.parse(ls) : null;
      } catch { return null; }
    },
    async set(k, d) {
      try {
        await idbSet(k, d);
        try { localStorage.setItem(k, JSON.stringify(d)); } catch {}
        this.notify(k, d);
      } catch(e) {
        try { localStorage.setItem(k, JSON.stringify(d)); this.notify(k, d); } catch {}
      }
    }
  };
})();

async function callClaude(prompt, sys="") {
  const payload = {
    model: "claude-sonnet-4-20250514",
    max_tokens: 1000,
    messages: [{ role:"user", content: prompt }]
  };
  if(sys) payload.system = sys;
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
  });
  if(!r.ok) throw new Error("Claude API "+r.status);
  const d = await r.json();
  const t = d.content?.find(b=>b.type==="text")?.text;
  if(!t) throw new Error("Respons kosong");
  return t;
}

function renderMD(text){
  if(!text) return null;
  return text.split("\n").map((line,i)=>{
    let c=line.replace(/\*\*(.*?)\*\*/g,'<strong class="font-bold text-slate-200">$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>');
    if(line.trim().startsWith("* ")||line.trim().startsWith("- "))
      return <li key={i} className="ml-4 list-disc pl-1 mb-1 text-slate-300 text-sm" dangerouslySetInnerHTML={{__html:c.replace(/^[\*\-]\s+/,'')}}/>;
    if(line.trim().startsWith("### "))
      return <h5 key={i} className="text-sm font-bold text-slate-100 mt-3 mb-1" dangerouslySetInnerHTML={{__html:c.replace(/^###\s+/,'')}}/>;
    if(line.trim().startsWith("## "))
      return <h4 key={i} className="text-base font-bold text-indigo-400 mt-4 mb-2 border-b border-slate-700 pb-1" dangerouslySetInnerHTML={{__html:c.replace(/^##\s+/,'')}}/>;
    return <p key={i} className="mb-1.5 leading-relaxed text-slate-300 text-sm" dangerouslySetInnerHTML={{__html:c}}/>;
  });
}

function Field({label,children,className=""}){

  );
}

function Modul2Laporan({triggerToast,refreshSignal}){

function Modul5Owner({triggerToast,refreshSignal}){

  const [tg,setTg]=useState([]);

  const [aiR,setAiR]=useState("");
  const [isC,setIsC]=useState(false);
  useEffect(()=>{
    Promise.all([appStorage.get("rifim_v4_chk"),appStorage.get("rifim_v4_lap"),appStorage.get("rifim_v4_fls"),appStorage.get("rifim_v4_tgh")]).then(([a,b,c,d])=>{ setChk(a||[]); setLap(b||{}); setFl(c||{}); setTg(d||[]); });
    appStorage.get("rifim_v4_owner_ai").then(x=>{ if(x) setAiR(x); });
  },[refreshSignal]);
  const g=lap._global||{};
  const totSal=CAB.reduce((s,c)=>s+(Number(lap[c]?.sal)||0),0);
  const totPng=CAB.reduce((s,c)=>s+(Number(lap[c]?.png)||0),0);
  const totFee=(Number(g.fee_btm)||0)+(Number(g.fee_mnd)||0)+(Number(g.fee_jbi)||0)+(Number(g.fee_sur)||0)+(Number(g.fee_akun)||0)+(Number(g.fee_pot)||0);
  const totAsk=(Number(g.ask_b)||0)*550000+(Number(g.ask_p)||0)*350000+(Number(g.ask_k)||0)*500000;
  const totIn=totSal+totFee+totAsk;
  const profit=totIn-totPng;
  const td=today();
  const upT=FILES.filter(f=>fl[f.id]?.ts?.startsWith(td)).length;
  const tdChk=chk.filter(x=>x.tgl===td);
  const avgP=tdChk.length>0?Math.round(tdChk.reduce((s,x)=>s+x.pct,0)/tdChk.length):0;
  const totTagP=tg.filter(x=>x.st==="PENDING"||x.st==="OVERDUE").reduce((s,x)=>s+x.nom,0);
  const perfA=ADM.map(a=>{ const it=chk.filter(x=>x.admin===a); const avg=it.length>0?Math.round(it.reduce((s,x)=>s+x.pct,0)/it.length):0; return {admin:a,n:it.length,avg}; });
  const maxBV=Math.max(...CAB.map(c=>Math.abs((Number(lap[c]?.sal)||0)-(Number(lap[c]?.png)||0))),1);
  const ask=async(q)=>{
    const aQ=q||aiQ; if(!aQ.trim()) return;

    const cC=CAB.map(c=>{ const b=lap[c]||{}; const n=(Number(b.sal)||0)-(Number(b.png)||0); return `- ${c.replace("ID Rifim ","")}: Saldo=${rp(b.sal)}, Pengeluaran=${rp(b.png)}, Margin=${rp(n)}, Driver=${b.drv||0}, Order=${b.ord||0}`; }).join("\n");
    const cA=perfA.map(p=>`- ${p.admin}: ${p.avg}% (${p.n} entri)`).join("\n")+`\nPerforma hari ini: ${avgP}%. File terupdate: ${upT}/${FILES.length}.`;
    const prompt=`Halo, Anda penasihat Pak Bobby (Owner PT. Rifim International Gemilang — vendor Maxim bandara Indonesia: Batam, Jambi, Pekanbaru, Balikpapan, Manado).\n\n[KEUANGAN]\n${cK}\n\n[CABANG]\n${cC}\n\n[ADMINISTRASI]\n${cA}\n\nPertanyaan: "${aQ}"\n\nJawab analitis, taktis, berorientasi hasil. Bahasa Indonesia profesional.`;
    try{
      const res=await callClaude(prompt,"Business Executive Advisor eksklusif Pak Bobby, Owner PT. Rifim International Gemilang. Berikan saran manajerial berorientasi hasil.");
      setAiR(res); appStorage.set("rifim_v4_owner_ai",res);
      setAiQ(""); triggerToast("Saran AI siap!","success");

    finally{ setIsC(false); }

          {l:"Pengeluaran",v:rp(totPng),c:"text-rose-600",bg:"bg-rose-50 text-rose-600",ic:"ti-trending-down"},
          {l:"Profit Bersih",v:rp(profit),c:profit>=0?"text-indigo-600":"text-rose-600",bg:profit>=0?"bg-indigo-50 text-indigo-600":"bg-rose-50 text-rose-600",ic:"ti-cash"},
          {l:"Kewajiban Pending",v:rp(totTagP),c:"text-amber-500",bg:"bg-amber-50 text-amber-500",ic:"ti-wallet"}
        ].map(k=>(
          <div key={k.l} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex items-center justify-between">
            <div><span className="text-xs font-semibold text-slate-500 block uppercase tracking-wider">{k.l}</span><span className={`text-lg font-black ${k.c}`}>{k.v}</span></div>
            <span className={`w-10 h-10 rounded-full flex items-center justify-center ${k.bg}`}><i className={`ti ${k.ic} text-xl`}></i></span>
          </div>

      </div>

        </div>
        <div className="flex flex-wrap gap-2 mb-4">
          {[["✨ Ringkasan Keuangan","Beri ringkasan eksekutif kesehatan keuangan operasional Rifim hari ini"],

            ["✨ Evaluasi Kinerja Admin","Evaluasi kepatuhan staf admin Govind, Tasya, Abel dan status update file"],
            ["✨ Cabang Terbaik","Cabang mana paling menguntungkan? Apa yang bisa direplikasi ke cabang lain?"]
          ].map(([l,q])=>(
            <button key={l} onClick={()=>ask(q)} className="text-xs bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700/50 px-3 py-1.5 rounded-lg transition-all">{l}</button>

          <div className="bg-slate-950 rounded-xl p-5 border border-slate-800 max-h-[300px] overflow-y-auto mb-4">

          <button onClick={()=>ask()} disabled={isC||!aiQ.trim()} className={`px-5 rounded-xl font-bold text-sm transition-all flex items-center gap-1.5 shrink-0 ${isC||!aiQ.trim()?"bg-slate-800 text-slate-500 cursor-not-allowed":"bg-indigo-600 hover:bg-indigo-700 text-white"}`}>
            {isC?<><i className="ti ti-loader animate-spin"></i>Berpikir...</>:<><i className="ti ti-send"></i>✨ Tanya AI</>}
          </button>
        </div>
      </div>
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 overflow-hidden">
        <div className="flex items-center gap-2 mb-4"><span className="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center"><i className="ti ti-chart-bar text-xl"></i></span><div><h3 className="text-base font-bold text-slate-800">Perbandingan Kinerja Operasional Cabang</h3><p className="text-xs text-slate-500">Data laporan terakhir</p></div></div>
        <div className="overflow-x-auto -mx-6"><div className="inline-block min-w-full align-middle px-6">

              <th className="py-2.5 px-2 text-right text-xs font-bold text-slate-500 uppercase">Driver</th>
              <th className="py-2.5 px-2 text-right text-xs font-bold text-slate-500 uppercase">Margin</th>
            </tr></thead>
            <tbody className="divide-y divide-slate-100">

}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
