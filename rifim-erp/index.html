<link

/>

</head>

<body>

<div class="login-wrapper">

  <div class="login-container fade">

    <div class="brand-area">

      <img
        src="assets/logo.png"
        class="logo"
      >

      <h1>RIFIM ERP</h1>

      <h3>
        PT. RIFIM INTERNATIONAL GEMILANG
      </h3>

      <p>
        Airport Operations & Administration
      </p>

    </div>

    <div class="login-card">

      <div class="form-group">

        <label>LOGIN SEBAGAI</label>

        <select id="email">

          <option>
            rifim01@adminrifim.org
          </option>

          <option>
            supervisor@rifim.org
          </option>

          <option>
            staff@rifim.org
          </option>

        </select>

      </div>

      <div class="form-group">

        <label>PASSWORD AKSES</label>

        <div class="password-wrapper">

          <input
            type="password"
            id="password"
            placeholder="Masukkan password..."
          >

          <span
            class="eye"
            onclick="togglePassword()"
          >
            👁️
          </span>

        </div>

      </div>

      <button
        class="login-btn"
        onclick="login()"
      >
        🔐 Masuk ke Sistem
      </button>

      <div class="footer-text">

        INTEGRITAS • INOVASI •
        KUALITAS • KEBERLANJUTAN

      </div>

    </div>

  </div>

</div>

<script src="app.js"></script>

<script>

function togglePassword(){

  const password =
  document.getElementById(
    'password'
  );

  if(password.type === 'password'){

    password.type = 'text';

  }else{

    password.type = 'password';

  }

}

if('serviceWorker' in navigator){

  navigator.serviceWorker.register(
    'service-worker.js'
  );

}

</script>

</body>
</html>
