```html
<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    RIFIM ERP
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

</head>

<body class="dark">

  <div class="login-page">

    <div class="login-card fade">

      <div class="logo-area">

        <img
          src="logo.png"
          class="logo"
        >

        <h1>RIFIM ERP</h1>

        <p>
          PT. RIFIM INTERNATIONAL GEMILANG
        </p>

        <span class="subtitle">
          Airport Operations & Administration
        </span>

      </div>

      <div class="form-group">

        <label>Email Staff</label>

        <input
          type="email"
          id="email"
          placeholder="Masukkan email..."
        >

      </div>

      <div class="form-group">

        <label>Password Akses</label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Masukkan password..."
          >

          <button
            class="show-btn"
            onclick="togglePassword()"
          >
            👁️
          </button>

        </div>

      </div>

      <button
        class="login-btn"
        onclick="login()"
      >
        🔐 Masuk ke Sistem
      </button>

      <div class="login-footer">

        Integritas • Inovasi • Kualitas • Keberlanjutan

      </div>

    </div>

  </div>

<script src="app.js"></script>

<script>

function togglePassword(){

  const input =
  document.getElementById(
    'password'
  );

  if(input.type === 'password'){

    input.type = 'text';

  }else{

    input.type = 'password';

  }

}

if('serviceWorker' in navigator){

  navigator.serviceWorker.register(
    'service-worker.js'
  );

}

</script>

</body>
</html>
```
