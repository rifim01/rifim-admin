<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIFIM ERP — Login</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

    body{
      width:100%; min-height:100vh;
      display:flex; justify-content:center; align-items:center; padding:20px;
      background:
        linear-gradient(rgba(255,255,255,.88), rgba(255,235,235,.92)),
        url('assets/bg.jpg') center/cover no-repeat;
    }

    .container{ width:100%; max-width:440px; text-align:center; }

    .logo{
      width:120px; height:120px; object-fit:cover;
      border-radius:28px; margin-bottom:20px;
      box-shadow:0 12px 35px rgba(0,0,0,.18);
    }

    h1{ font-size:48px; font-weight:800; color:#1e293b; margin-bottom:6px; }

    .subtitle{ color:#ef4444; font-size:18px; font-weight:700; margin-bottom:6px; }
    .desc{ color:#64748b; font-size:14px; margin-bottom:30px; }

    .login-card{
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(20px);
      border-radius:32px; padding:32px;
      box-shadow:0 12px 40px rgba(0,0,0,.10);
    }

    .form-group{ margin-bottom:20px; text-align:left; }
    .form-group label{
      display:block; margin-bottom:8px;
      color:#475569; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    }

    .input-box{ position:relative; }
    .input-box input{
      width:100%; height:56px; border-radius:16px;
      border:2px solid #e2e8f0; padding:0 48px 0 18px;
      font-size:15px; font-family:'Poppins',sans-serif;
      background:#fafafa; color:#1e293b; transition:.25s;
    }
    .input-box input:focus{
      outline:none; border-color:#ef4444;
      box-shadow:0 0 0 4px rgba(239,68,68,.10);
      background:#fff;
    }
    .toggle-pw{
      position:absolute; right:16px; top:50%;
      transform:translateY(-50%);
      cursor:pointer; font-size:18px; user-select:none;
    }

    .login-btn{
      width:100%; height:56px; border:none; border-radius:16px;
      background:linear-gradient(135deg,#ef4444,#dc2626);
      color:#fff; font-size:18px; font-weight:700;
      font-family:'Poppins',sans-serif;
      cursor:pointer; transition:.25s; margin-top:4px;
      box-shadow:0 8px 24px rgba(239,68,68,.30);
    }
    .login-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(239,68,68,.40); }
    .login-btn:disabled{ opacity:.6; transform:none; cursor:not-allowed; }

    .reset-btn{
      background:none; border:none; color:#94a3b8;
      margin-top:14px; cursor:pointer; font-size:13px; font-weight:600;
      font-family:'Poppins',sans-serif;
    }
    .reset-btn:hover{ color:#64748b; }

    #loading{ display:none; margin-top:14px; color:#ef4444; font-weight:700; font-size:14px; }

    .footer{
      margin-top:22px; color:#cbd5e1;
      font-size:11px; font-weight:700; letter-spacing:1px; line-height:2;
    }

    @media(max-width:480px){
      h1{ font-size:38px; }
      .login-card{ padding:24px; }
    }
  </style>
</head>

<body>
  <div class="container">

    <img src="assets/logo.png" class="logo" alt="RIFIM Logo" />
    <h1>RIFIM ERP</h1>
    <div class="subtitle">PT. RIFIM INTERNATIONAL GEMILANG</div>
    <div class="desc">Airport Operations & Administration</div>

    <div class="login-card">

      <div class="form-group">
        <label>Email Staff</label>
        <div class="input-box">
          <input type="email" id="email" placeholder="nama@adminrifim.org" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label>Password Akses</label>
        <div class="input-box">
          <input type="password" id="password" placeholder="Masukkan password..." autocomplete="current-password" />
          <span class="toggle-pw" onclick="togglePw()">👁️</span>
        </div>
      </div>

      <button class="login-btn" id="loginBtn" onclick="login()">
        🔐 Masuk ke Sistem
      </button>

      <br />
      <button class="reset-btn" onclick="resetPassword()">Reset Password</button>

      <div id="loading">⏳ Memproses login...</div>

      <div class="footer">
        INTEGRITAS • INOVASI • KUALITAS • KEBERLANJUTAN
      </div>

    </div>
  </div>

  <script>
    // ── Firebase Config ───────────────────────────────────
    firebase.initializeApp({
      apiKey:            "AIzaSyCROrmmx9cxlAeMEobuT9DAWmVuF1oZrG4",
      authDomain:        "gen-lang-client-0837778946.firebaseapp.com",
      projectId:         "gen-lang-client-0837778946",
      storageBucket:     "gen-lang-client-0837778946.firebasestorage.app",
      messagingSenderId: "984064974556",
      appId:             "1:984064974556:web:42e4771e687590b2595e19",
    });
    const auth = firebase.auth();

    // ── Jika sudah login, langsung ke dashboard ───────────
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = "dashboard.html";
    });

    // ── Toggle password ───────────────────────────────────
    function togglePw() {
      const el = document.getElementById("password");
      el.type = el.type === "password" ? "text" : "password";
    }

    // ── Login ─────────────────────────────────────────────
    async function login() {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn      = document.getElementById("loginBtn");
      const loading  = document.getElementById("loading");

      if (!email || !password) {
        alert("Email & Password wajib diisi");
        return;
      }

      btn.disabled      = true;
      loading.style.display = "block";

      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        localStorage.setItem("rifim_user", JSON.stringify({
          uid: cred.user.uid, email: cred.user.email
        }));
        window.location.href = "dashboard.html";
      } catch (err) {
        alert("Login gagal:\n\n" + err.message);
        btn.disabled = false;
        loading.style.display = "none";
      }
    }

    // ── Reset password ────────────────────────────────────
    async function resetPassword() {
      const email = document.getElementById("email").value.trim();
      if (!email) { alert("Masukkan email terlebih dahulu"); return; }
      try {
        await auth.sendPasswordResetEmail(email);
        alert("✅ Link reset password dikirim ke " + email);
      } catch (err) {
        alert(err.message);
      }
    }

    // ── Enter key ─────────────────────────────────────────
    document.addEventListener("keypress", e => { if (e.key === "Enter") login(); });

    // ── Service Worker ────────────────────────────────────
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
