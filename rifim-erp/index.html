<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>RIFIM ERP</title>

  <!-- PWA -->
  <link
    rel="manifest"
    href="manifest.json"
  />

  <!-- ICON -->
  <link
    rel="icon"
    href="assets/icons/icon-192.png"
  />

  <!-- GOOGLE FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{

      width:100%;
      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:20px;

      background:
      linear-gradient(
        rgba(255,255,255,.90),
        rgba(255,240,240,.92)
      ),
      url('assets/bg.jpg');

      background-size:cover;
      background-position:center;

      overflow-x:hidden;
    }

    .container{

      width:100%;
      max-width:430px;

      text-align:center;
    }

    .logo{

      width:130px;
      height:130px;

      object-fit:cover;

      border-radius:30px;

      margin-bottom:25px;

      box-shadow:
      0 15px 40px rgba(0,0,0,.18);
    }

    .title{

      font-size:52px;
      font-weight:800;

      color:#1e293b;

      margin-bottom:8px;

      letter-spacing:1px;
    }

    .subtitle{

      color:#ef4444;

      font-size:20px;
      font-weight:700;

      margin-bottom:8px;
    }

    .desc{

      color:#64748b;

      margin-bottom:35px;

      font-size:15px;
    }

    .login-card{

      background:
      rgba(255,255,255,.95);

      backdrop-filter:blur(20px);

      border-radius:35px;

      padding:35px;

      box-shadow:
      0 15px 45px rgba(0,0,0,.10);
    }

    .form-group{

      margin-bottom:22px;

      text-align:left;
    }

    .form-group label{

      display:block;

      margin-bottom:10px;

      color:#475569;

      font-size:14px;
      font-weight:700;

      text-transform:uppercase;
    }

    .input-box{

      position:relative;
    }

    .input-box input{

      width:100%;
      height:60px;

      border-radius:18px;

      border:2px solid #e2e8f0;

      padding:0 20px;

      font-size:16px;

      transition:.3s;
    }

    .input-box input:focus{

      outline:none;

      border-color:#ef4444;

      box-shadow:
      0 0 0 5px rgba(239,68,68,.1);
    }

    .toggle-password{

      position:absolute;

      right:18px;
      top:50%;

      transform:translateY(-50%);

      cursor:pointer;

      font-size:18px;
    }

    .login-btn{

      width:100%;
      height:60px;

      border:none;

      border-radius:18px;

      background:
      linear-gradient(
        135deg,
        #ef4444,
        #ff2d2d
      );

      color:#fff;

      font-size:20px;
      font-weight:700;

      cursor:pointer;

      transition:.3s;

      margin-top:5px;

      box-shadow:
      0 10px 30px rgba(239,68,68,.30);
    }

    .login-btn:hover{

      transform:translateY(-2px);

      box-shadow:
      0 15px 35px rgba(239,68,68,.40);
    }

    .reset-btn{

      background:none;
      border:none;

      color:#64748b;

      margin-top:18px;

      cursor:pointer;

      font-size:14px;
      font-weight:600;
    }

    .loading{

      display:none;

      margin-top:18px;

      color:#ef4444;

      font-weight:700;
    }

    .footer{

      margin-top:25px;

      color:#94a3b8;

      font-size:12px;
      font-weight:700;

      letter-spacing:1px;

      line-height:1.8;
    }

    @media(max-width:768px){

      .title{
        font-size:42px;
      }

      .subtitle{
        font-size:17px;
      }

      .login-card{
        padding:28px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- LOGO -->

    <img
      src="assets/logo.png"
      class="logo"
    />

    <!-- TITLE -->

    <h1 class="title">
      RIFIM ERP
    </h1>

    <div class="subtitle">
      PT. RIFIM INTERNATIONAL GEMILANG
    </div>

    <div class="desc">
      Airport Operations & Administration
    </div>

    <!-- LOGIN CARD -->

    <div class="login-card">

      <!-- EMAIL -->

      <div class="form-group">

        <label>
          Email Staff
        </label>

        <div class="input-box">

          <input
            type="email"
            id="email"
            placeholder="Masukkan email staff..."
          />

        </div>

      </div>

      <!-- PASSWORD -->

      <div class="form-group">

        <label>
          Password Akses
        </label>

        <div class="input-box">

          <input
            type="password"
            id="password"
            placeholder="Masukkan password..."
          />

          <span
            class="toggle-password"
            onclick="togglePassword()"
          >
            👁️
          </span>

        </div>

      </div>

      <!-- BUTTON -->

      <button
        class="login-btn"
        onclick="login()"
      >
        🔐 Masuk ke Sistem
      </button>

      <!-- RESET -->

      <button
        class="reset-btn"
        onclick="resetPassword()"
      >
        Reset Password
      </button>

      <!-- LOADING -->

      <div
        class="loading"
        id="loading"
      >
        Memproses login...
      </div>

      <!-- FOOTER -->

      <div class="footer">

        INTEGRITAS • INOVASI •
        KUALITAS • KEBERLANJUTAN

      </div>

    </div>

  </div>

  <script>

    // =====================================
    // FIREBASE CONFIG
    // =====================================

    const firebaseConfig = {

      apiKey:
      "AIzaSyCROrmmx9cxlAeMEobuT9DAWmVuF1oZrG4",

      authDomain:
      "gen-lang-client-0837778946.firebaseapp.com",

      projectId:
      "gen-lang-client-0837778946",

      storageBucket:
      "gen-lang-client-0837778946.firebasestorage.app",

      messagingSenderId:
      "984064974556",

      appId:
      "1:984064974556:web:42e4771e687590b2595e19",

      measurementId:
      "G-R5VGPRKM61"

    };

    // =====================================
    // INIT FIREBASE
    // =====================================

    firebase.initializeApp(
      firebaseConfig
    );

    const auth =
    firebase.auth();

    const db =
    firebase.firestore();

    // =====================================
    // TOGGLE PASSWORD
    // =====================================

    function togglePassword(){

      const password =
      document.getElementById(
        'password'
      );

      if(
        password.type === "password"
      ){

        password.type = "text";

      }else{

        password.type = "password";

      }

    }

    // =====================================
    // LOGIN FUNCTION
    // =====================================

    async function login(){

      const email =
      document.getElementById(
        'email'
      ).value.trim();

      const password =
      document.getElementById(
        'password'
      ).value.trim();

      const loading =
      document.getElementById(
        'loading'
      );

      // VALIDATION

      if(
        !email || !password
      ){

        alert(
          "Email & Password wajib diisi"
        );

        return;
      }

      loading.style.display =
      "block";

      try{

        // LOGIN FIREBASE

        const userCredential =
        await auth
        .signInWithEmailAndPassword(
          email,
          password
        );

        const user =
        userCredential.user;

        console.log(
          "Login sukses:",
          user.email
        );

        // SAVE SESSION

        localStorage.setItem(
          "rifim_user",
          JSON.stringify({
            uid:user.uid,
            email:user.email
          })
        );

        // REDIRECT

        window.location.href =
        "dashboard.html";

      }catch(error){

        console.log(error);

        alert(
          "Login gagal:\n\n" +
          error.message
        );

      }

      loading.style.display =
      "none";

    }

    // =====================================
    // RESET PASSWORD
    // =====================================

    async function resetPassword(){

      const email =
      document.getElementById(
        'email'
      ).value.trim();

      if(!email){

        alert(
          "Masukkan email terlebih dahulu"
        );

        return;
      }

      try{

        await auth
        .sendPasswordResetEmail(
          email
        );

        alert(
          "Link reset password berhasil dikirim ke email."
        );

      }catch(error){

        alert(
          error.message
        );

      }

    }

    // =====================================
    // AUTO LOGIN CHECK
    // =====================================

    auth.onAuthStateChanged(
      (user)=>{

      if(user){

        console.log(
          "User aktif:",
          user.email
        );

      }

    });

    // =====================================
    // ENTER KEY LOGIN
    // =====================================

    document.addEventListener(
      "keypress",
      function(e){

        if(e.key === "Enter"){

          login();

        }

      }
    );

    // =====================================
    // SERVICE WORKER
    // =====================================

    if(
      'serviceWorker'
      in navigator
    ){

      navigator.serviceWorker
      .register(
        'service-worker.js'
      )

      .then(()=>{

        console.log(
          "Service Worker Active"
        );

      });

    }

  </script>

</body>
</html>
```
