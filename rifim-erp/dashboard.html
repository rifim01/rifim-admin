<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>RIFIM ERP Dashboard</title>

  <!-- FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- CHART JS -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{

      background:
      #f5f7fb;

      display:flex;

      min-height:100vh;
    }

    /* SIDEBAR */

    .sidebar{

      width:260px;

      background:
      linear-gradient(
        180deg,
        #ef4444,
        #dc2626
      );

      color:white;

      padding:30px 20px;
    }

    .logo{

      font-size:32px;
      font-weight:800;

      margin-bottom:40px;
    }

    .menu a{

      display:flex;
      align-items:center;
      gap:12px;

      text-decoration:none;

      color:white;

      padding:15px 18px;

      border-radius:15px;

      margin-bottom:10px;

      transition:.3s;
    }

    .menu a:hover{

      background:
      rgba(255,255,255,.15);
    }

    /* MAIN */

    .main{

      flex:1;

      padding:30px;
    }

    .topbar{

      display:flex;
      justify-content:space-between;
      align-items:center;

      margin-bottom:30px;
    }

    .topbar h1{

      font-size:32px;
      color:#1e293b;
    }

    .logout-btn{

      border:none;

      background:#ef4444;

      color:white;

      padding:12px 20px;

      border-radius:12px;

      cursor:pointer;

      font-weight:600;
    }

    /* CARDS */

    .cards{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(220px,1fr));

      gap:20px;

      margin-bottom:30px;
    }

    .card{

      background:white;

      padding:25px;

      border-radius:22px;

      box-shadow:
      0 10px 30px rgba(0,0,0,.05);
    }

    .card h3{

      color:#64748b;

      font-size:16px;

      margin-bottom:15px;
    }

    .card .number{

      font-size:42px;
      font-weight:800;

      color:#ef4444;
    }

    /* CHART */

    .chart-box{

      background:white;

      padding:30px;

      border-radius:22px;

      box-shadow:
      0 10px 30px rgba(0,0,0,.05);
    }

    .chart-title{

      font-size:26px;
      font-weight:700;

      margin-bottom:20px;

      color:#1e293b;
    }

    /* MOBILE */

    @media(max-width:768px){

      body{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
      }

    }

  </style>

</head>

<body>

  <!-- SIDEBAR -->

  <div class="sidebar">

    <div class="logo">
      🔴 RIFIM ERP
    </div>

    <div class="menu">

      <a href="dashboard.html">
        📊 Dashboard
      </a>

      <a href="attendance.html">
        📍 Attendance
      </a>

      <a href="jadwal.html">
        📅 Jadwal Shift
      </a>

      <a href="rekap.html">
        📈 Rekap
      </a>

    </div>

  </div>

  <!-- MAIN -->

  <div class="main">

    <!-- TOPBAR -->

    <div class="topbar">

      <h1>
        Dashboard
      </h1>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

    <!-- CARDS -->

    <div class="cards">

      <div class="card">

        <h3>Total Staff</h3>

        <div class="number">
          145
        </div>

      </div>

      <div class="card">

        <h3>Hadir Hari Ini</h3>

        <div class="number">
          120
        </div>

      </div>

      <div class="card">

        <h3>Belum Absen</h3>

        <div class="number">
          25
        </div>

      </div>

      <div class="card">

        <h3>Terlambat</h3>

        <div class="number">
          8
        </div>

      </div>

    </div>

    <!-- CHART -->

    <div class="chart-box">

      <div class="chart-title">
        📈 Grafik Kehadiran
      </div>

      <canvas id="attendanceChart"></canvas>

    </div>

  </div>

  <script>

    // CHART

    const ctx =
    document
    .getElementById(
      'attendanceChart'
    );

    new Chart(ctx,{

      type:'bar',

      data:{

        labels:[
          'Senin',
          'Selasa',
          'Rabu',
          'Kamis',
          'Jumat'
        ],

        datasets:[{

          label:'Attendance',

          data:[
            120,
            130,
            125,
            140,
            138
          ],

          backgroundColor:
          '#ef4444',

          borderRadius:10

        }]

      },

      options:{

        responsive:true,

        plugins:{

          legend:{
            display:true
          }

        }

      }

    });

    // LOGOUT

    function logout(){

      localStorage.clear();

      window.location.href =
      "index.html";
    }

  </script>

</body>
</html>
```
