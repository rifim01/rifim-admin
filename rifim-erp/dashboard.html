<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dashboard - RIFIM ERP
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="dashboard">

  <aside class="sidebar">

    <h1>
      🔴 RIFIM ERP
    </h1>

    <nav>

      <a href="dashboard.html">
        📊 Dashboard
      </a>

      <a href="attendance.html">
        📍 Attendance
      </a>

      <a href="jadwal.html">
        🗓 Jadwal Shift
      </a>

      <a href="rekap.html">
        📈 Rekap
      </a>

    </nav>

  </aside>

  <main class="main-content">

    <div class="topbar">

      <h2>
        Dashboard Overview
      </h2>

      <button onclick="logout()">
        Logout
      </button>

    </div>

    <div class="cards">

      <div class="card">
        <h3>Total Staff</h3>
        <h1>145</h1>
      </div>

      <div class="card">
        <h3>Hadir Hari Ini</h3>
        <h1>120</h1>
      </div>

      <div class="card">
        <h3>Belum Absen</h3>
        <h1>25</h1>
      </div>

      <div class="card">
        <h3>Terlambat</h3>
        <h1>8</h1>
      </div>

    </div>

    <div class="chart-box">

      <h2>
        📈 Grafik Kehadiran
      </h2>

      <canvas id="attendanceChart"></canvas>

    </div>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx =
document.getElementById(
  'attendanceChart'
);

new Chart(ctx, {

  type: 'bar',

  data: {

    labels: [
      'Sen',
      'Sel',
      'Rab',
      'Kam',
      'Jum'
    ],

    datasets: [{

      label: 'Attendance',

      data: [
        120,
        130,
        125,
        140,
        138
      ],

      backgroundColor:
      '#ef4444',

      borderRadius: 10

    }]

  }

});

function logout(){

  localStorage.clear();

  window.location =
  "index.html";

}

</script>

</body>
</html>
