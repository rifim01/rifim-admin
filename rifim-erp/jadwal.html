<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RIFIM ERP - Jadwal Shift</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    font-family:Inter,sans-serif;
    background:#050816;
    color:white;
}

.layout{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#040b1f;
    padding:30px 20px;
    border-right:1px solid rgba(255,255,255,.08);
}

.logo{
    text-align:center;
    margin-bottom:40px;
}

.logo img{
    width:90px;
    border-radius:20px;
}

.logo h1{
    font-size:22px;
    margin-top:10px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.menu a{
    color:white;
    text-decoration:none;
    font-size:20px;
}

/* CONTENT */

.content{
    flex:1;
    padding:30px;
}

.topbar{
    background:white;
    color:#111827;
    padding:20px 30px;
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.topbar h2{
    margin:0;
}

.top-actions{
    display:flex;
    gap:15px;
}

.btn{
    border:none;
    padding:14px 22px;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
}

.btn-drive{
    background:#dcfce7;
    color:#16a34a;
}

.btn-logout{
    background:#f3f4f6;
}

/* MAIN CARD */

.card{
    background:linear-gradient(
        180deg,
        #09122f,
        #040816
    );

    border-radius:30px;
    padding:30px;
    border:1px solid rgba(255,255,255,.05);
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.title{
    display:flex;
    align-items:center;
    gap:20px;
}

.title h1{
    margin:0;
    font-size:48px;
}

.small{
    color:#38bdf8;
    letter-spacing:5px;
    font-size:14px;
}

.generate-row{
    display:flex;
    gap:15px;
    align-items:center;
}

.generate-btn{
    background:#10b981;
    color:white;
}

.sync-btn{
    background:#1e293b;
    color:white;
}

.pdf-btn{
    background:#ef4444;
    color:white;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    margin-top:30px;
}

.stat-box{
    background:#08122c;
    padding:20px;
    border-radius:20px;
}

.stat-box h3{
    margin:0;
    color:#9ca3af;
    font-size:15px;
}

.stat-box h1{
    margin-top:10px;
    font-size:40px;
}

/* TABLE */

.table-wrapper{
    overflow:auto;
    margin-top:30px;
    border-radius:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#0f172a;
}

th{
    padding:18px;
    text-align:center;
    color:#94a3b8;
}

td{
    padding:18px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.staff-name{
    text-align:left;
    font-weight:700;
}

.badge{
    padding:8px 14px;
    border-radius:12px;
    font-size:13px;
    font-weight:700;
}

.badge-pagi{
    background:#052e16;
    color:#22c55e;
}

.badge-siang{
    background:#3f1d00;
    color:#f59e0b;
}

.badge-libur{
    background:#1e293b;
    color:#94a3b8;
}

.bottom-grid{
    margin-top:30px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.bottom-card{
    background:#0b132d;
    padding:25px;
    border-radius:25px;
}

.bottom-card h2{
    margin-top:0;
}

.small-table{
    width:100%;
}

.small-table td{
    text-align:left;
}

@media(max-width:1200px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .bottom-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            <img src="assets/logo.png">
            <h1>RIFIM ERP</h1>
        </div>

        <div class="menu">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="attendance.html">📍 Attendance</a>
            <a href="jadwal.html">🗓 Jadwal Shift</a>
            <a href="rekap.html">📈 Rekap</a>
        </div>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <div class="topbar">

            <div>
                <h2>Sistem Admin Rifim Terintegrasi</h2>
                <small>ERP Management System</small>
            </div>

            <div class="top-actions">

                <button class="btn btn-drive">
                    📁 Google Drive
                </button>

                <button class="btn btn-logout">
                    Keluar
                </button>

            </div>

        </div>

        <!-- CARD -->

        <div class="card">

            <div class="header-row">

                <div class="title">

                    <div>
                        <div class="small">RIFIM</div>
                        <h1>Jadwal Kerja Staff</h1>
                    </div>

                </div>

                <div class="generate-row">

                    <button class="btn sync-btn">
                        🔄 Sync DB Staff
                    </button>

                    <button class="btn pdf-btn">
                        📄 Simpan PDF ke Drive
                    </button>

                </div>

            </div>

            <!-- STATS -->

            <div class="stats">

                <div class="stat-box">
                    <h3>PAGI</h3>
                    <h1 id="pagiCount">0</h1>
                </div>

                <div class="stat-box">
                    <h3>SIANG</h3>
                    <h1 id="siangCount">0</h1>
                </div>

                <div class="stat-box">
                    <h3>LIBUR</h3>
                    <h1 id="liburCount">0</h1>
                </div>

                <div class="stat-box">
                    <h3>Total Staff</h3>
                    <h1 id="staffCount">0</h1>
                </div>

                <div class="stat-box">

                    <button
                        class="btn generate-btn"
                        onclick="generateSchedule()"
                        style="width:100%;margin-top:15px;"
                    >
                        ✨ Generate Jadwal
                    </button>

                </div>

            </div>

            <!-- TABLE -->

            <div class="table-wrapper">

                <table>

                    <thead>

                    <tr>
                        <th>STAFF</th>
                        <th>SEN</th>
                        <th>SEL</th>
                        <th>RAB</th>
                        <th>KAM</th>
                        <th>JUM</th>
                        <th>SAB</th>
                        <th>MIN</th>
                    </tr>

                    </thead>

                    <tbody id="scheduleBody">

                    </tbody>

                </table>

            </div>

            <!-- BOTTOM -->

            <div class="bottom-grid">

                <div class="bottom-card">

                    <h2>Keterangan Kehadiran</h2>

                    <table class="small-table">

                        <tbody id="keteranganTable">

                        </tbody>

                    </table>

                </div>

                <div class="bottom-card">

                    <h2>Status Absensi Mingguan</h2>

                    <table class="small-table">

                        <thead>
                        <tr>
                            <th>Nama</th>
                            <th>H</th>
                            <th>T</th>
                            <th>A</th>
                        </tr>
                        </thead>

                        <tbody id="statusTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const SHEET_ID =
"1fcraq3QHqIaD-13Ebzt6stT9aA6j_loTXeAtpNX12kw";

const SHEET_NAME =
"MASTER DATA STAFF";

const API =
`https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;

let staffData = [];

async function loadStaff(){

    const res = await fetch(API);

    const data = await res.json();

    staffData = data;

    document.getElementById(
        "staffCount"
    ).innerHTML = data.length;

    generateSchedule();

}

function randomShift(){

    const shifts = [
        "PAGI",
        "SIANG",
        "LIBUR"
    ];

    return shifts[
        Math.floor(
            Math.random()*shifts.length
        )
    ];

}

function badge(shift){

    if(shift==="PAGI")
        return `<span class="badge badge-pagi">PAGI</span>`;

    if(shift==="SIANG")
        return `<span class="badge badge-siang">SIANG</span>`;

    return `<span class="badge badge-libur">LIBUR</span>`;
}

function generateSchedule(){

    let pagi=0;
    let siang=0;
    let libur=0;

    let html = "";

    let statusHtml = "";

    let ketHtml = "";

    staffData.forEach(staff=>{

        const nama =
        staff["Nama"] ||
        staff["NAMA"] ||
        staff["nama"] ||
        "-";

        const cabang =
        staff["Cabang"] ||
        "-";

        const jabatan =
        staff["Jabatan"] ||
        "-";

        html += `
        <tr>

            <td class="staff-name">

                ${nama}<br>

                <small style="
                    color:#64748b;
                ">
                    ${jabatan}
                </small>

            </td>
        `;

        for(let i=0;i<7;i++){

            const shift = randomShift();

            if(shift==="PAGI") pagi++;
            if(shift==="SIANG") siang++;
            if(shift==="LIBUR") libur++;

            html += `
            <td>
                ${badge(shift)}
            </td>
            `;
        }

        html += `</tr>`;

        ketHtml += `
        <tr>
            <td>${nama}</td>
            <td>-</td>
        </tr>
        `;

        statusHtml += `
        <tr>
            <td>${nama}</td>
            <td style="color:#10b981;">0</td>
            <td style="color:#f59e0b;">0</td>
            <td style="color:#ef4444;">0</td>
        </tr>
        `;

    });

    document.getElementById(
        "scheduleBody"
    ).innerHTML = html;

    document.getElementById(
        "keteranganTable"
    ).innerHTML = ketHtml;

    document.getElementById(
        "statusTable"
    ).innerHTML = statusHtml;

    document.getElementById(
        "pagiCount"
    ).innerHTML = pagi;

    document.getElementById(
        "siangCount"
    ).innerHTML = siang;

    document.getElementById(
        "liburCount"
    ).innerHTML = libur;

}

loadStaff();

</script>

</body>
</html>
