  async

<script>

/* =========================
   CAMERA
========================= */

const camera =
document.getElementById(
  "camera"
);

const snapshot =
document.getElementById(
  "snapshot"
);

let selfieTaken = false;

async function startCamera(){

  try{

    const stream =
    await navigator
    .mediaDevices
    .getUserMedia({

      video:true

    });

    camera.srcObject =
    stream;

  }catch(error){

    console.error(error);

    alert(
      "Camera tidak tersedia"
    );

  }

}

startCamera();

/* =========================
   TAKE PHOTO
========================= */

function takePhoto(){

  const context =
  snapshot.getContext(
    "2d"
  );

  snapshot.width =
  camera.videoWidth;

  snapshot.height =
  camera.videoHeight;

  context.drawImage(
    camera,
    0,
    0
  );

  selfieTaken = true;

  alert(
    "✅ Foto berhasil diambil"
  );

}

/* =========================
   LIVE CLOCK
========================= */

setInterval(()=>{

  const now =
  new Date();

  document.getElementById(
    "liveClock"
  ).innerHTML =
  now.toLocaleString(
    "id-ID"
  );

},1000);

/* =========================
   GPS VALIDATION
========================= */

const airportLat = 1.1433;
const airportLng = 104.0150;

navigator.geolocation.getCurrentPosition(

  (position)=>{

    const lat =
    position.coords.latitude;

    const lng =
    position.coords.longitude;

    document.getElementById(
      "lat"
    ).innerHTML =
    lat;

    document.getElementById(
      "lng"
    ).innerHTML =
    lng;

    const distance =
    calculateDistance(

      lat,
      lng,
      airportLat,
      airportLng

    );

    document.getElementById(
      "distance"
    ).innerHTML =
    distance.toFixed(2) +
    " KM";

    const gpsStatus =
    document.getElementById(
      "gps-status"
    );

    if(distance <= 5){

      gpsStatus.innerHTML =
      "✅ Dalam Radius Bandara";

      gpsStatus.className =
      "gps-valid";

    }else{

      gpsStatus.innerHTML =
      "❌ Diluar Radius Bandara";

      gpsStatus.className =
      "gps-invalid";

    }

  },

  ()=>{

    alert(
      "GPS gagal diakses"
    );

  }

);

/* =========================
   DISTANCE FUNCTION
========================= */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371;

  const dLat =
  (lat2-lat1) *
  Math.PI / 180;

  const dLon =
  (lon2-lon1) *
  Math.PI / 180;

  const a =

    Math.sin(dLat/2) *
    Math.sin(dLat/2)

    +

    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180)

    *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  const c =
  2 *
  Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );

  return R * c;

}

/* =========================
   UPLOAD SELFIE
========================= */

const uploadBtn =
document.getElementById(
  "uploadBtn"
);

uploadBtn.addEventListener(

  "click",

  async ()=>{

    if(!selfieTaken){

      alert(
        "Ambil foto terlebih dahulu"
      );

      return;

    }

    try{

      const canvas =
      document.getElementById(
        "snapshot"
      );

      canvas.toBlob(

        async(blob)=>{

          const file =
          new File(

            [blob],

            `selfie-${Date.now()}.jpg`,

            {
              type:"image/jpeg"
            }

          );

          await uploadFileToDrive(
            file
          );

          addAttendanceRow(
            URL.createObjectURL(blob)
          );

        },

        "image/jpeg"

      );

    }catch(error){

      console.error(error);

      alert(
        "❌ Upload gagal"
      );

    }

  }

);

/* =========================
   LIVE TABLE
========================= */

function addAttendanceRow(photo){

  const table =
  document.getElementById(
    "attendanceTable"
  );

  const row =
  document.createElement(
    "tr"
  );

  const now =
  new Date();

  row.innerHTML = `

    <td>
      <img
        src="${photo}"
        class="table-photo"
      >
    </td>

    <td>
      Staff RIFIM
    </td>

    <td>
      ${now.toLocaleTimeString("id-ID")}
    </td>

    <td>
      <span class="status-success">
        Hadir
      </span>
    </td>

  `;

  table.prepend(row);

}

/* =========================
   SUBMIT ATTENDANCE
========================= */

function submitAttendance(){

  if(!selfieTaken){

    alert(
      "Silakan ambil selfie terlebih dahulu"
    );

    return;

  }

  alert(
    "✅ Absensi berhasil dikirim"
  );

}

/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.clear();

  window.location =
  "index.html";

}

</script>
