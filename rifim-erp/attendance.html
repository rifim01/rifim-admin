<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Attendance - RIFIM ERP
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-logo">

      <img
        src="assets/logo.png"
        alt="Logo"
      >

      <h1>
        RIFIM ERP
      </h1>

    </div>

    <nav>

      <a href="dashboard.html">
        📊 Dashboard
      </a>

      <a
        href="attendance.html"
        class="active"
      >
        📍 Attendance
      </a>

      <a href="jadwal.html">
        🗓 Jadwal Shift
      </a>

      <a href="rekap.html">
        📈 Rekap
      </a>

    </nav>

  </aside>

  <!-- MAIN CONTENT -->

  <main class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

      <div>

        <h2>
          Attendance Verification
        </h2>

        <p id="liveClock"></p>

      </div>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

    <!-- GRID -->

    <div class="attendance-grid">

      <!-- SELFIE -->

      <div class="attendance-card">

        <h2>
          📸 Selfie Verification
        </h2>

        <video
          id="camera"
          autoplay
          playsinline
        ></video>

        <canvas
          id="snapshot"
          style="display:none;"
        ></canvas>

        <button
          class="primary-btn"
          onclick="takePhoto()"
        >
          📷 Ambil Foto
        </button>

        <button
          id="uploadBtn"
          class="success-btn"
        >
          🚀 Upload Selfie
        </button>

      </div>

      <!-- GPS -->

      <div class="attendance-card">

        <h2>
          📍 GPS Validation
        </h2>

        <div class="gps-info">

          <p>
            <strong>Latitude:</strong>
            <span id="lat">-</span>
          </p>

          <p>
            <strong>Longitude:</strong>
            <span id="lng">-</span>
          </p>

          <p>
            <strong>Distance:</strong>
            <span id="distance">-</span>
          </p>

        </div>

        <div
          id="gps-status"
          class="gps-valid"
        >
          ⏳ Checking GPS...
        </div>

        <button
          class="primary-btn"
          onclick="submitAttendance()"
        >
          🚀 Kirim Absensi
        </button>

      </div>

    </div>

  </main>

</div>

<!-- GOOGLE API -->

<script src="https://apis.google.com/js/api.js"></script>

<script src="https://accounts.google.com/gsi/client"></script>

<script src="google-drive.js"></script>

<script>

const camera =
document.getElementById(
  "camera"
);

const airportLat = 1.1433;
const airportLng = 104.0150;

let selfieTaken = false;

/* =========================
   START CAMERA
========================= */

async function startCamera(){

  try{

    const stream =
    await navigator.mediaDevices.getUserMedia({

      video:true

    });

    camera.srcObject =
    stream;

  }catch(err){

    alert(
      "Camera tidak tersedia"
    );

  }

}

startCamera();

/* =========================
   TAKE PHOTO
========================= */

function takePhoto(){

  const canvas =
  document.getElementById(
    "snapshot"
  );

  const context =
  canvas.getContext(
    "2d"
  );

  canvas.width =
  camera.videoWidth;

  canvas.height =
  camera.videoHeight;

  context.drawImage(
    camera,
    0,
    0
  );

  selfieTaken = true;

  alert(
    "Foto berhasil diambil"
  );

}

/* =========================
   LIVE CLOCK
========================= */

setInterval(()=>{

  const now =
  new Date();

  document.getElementById(
    "liveClock"
  ).innerText =
  now.toLocaleString(
    "id-ID"
  );

},1000);

/* =========================
   GPS VALIDATION
========================= */

navigator.geolocation.getCurrentPosition(

  (position)=>{

    const lat =
    position.coords.latitude;

    const lng =
    position.coords.longitude;

    document.getElementById(
      "lat"
    ).innerText =
    lat;

    document.getElementById(
      "lng"
    ).innerText =
    lng;

    const distance =
    calculateDistance(

      lat,
      lng,
      airportLat,
      airportLng

    );

    document.getElementById(
      "distance"
    ).innerText =
    distance.toFixed(2) + " KM";

    const gpsStatus =
    document.getElementById(
      "gps-status"
    );

    if(distance <= 5){

      gpsStatus.innerHTML =
      "✅ Dalam Radius Bandara";

      gpsStatus.className =
      "gps-valid";

    }else{

      gpsStatus.innerHTML =
      "❌ Diluar Radius Bandara";

      gpsStatus.className =
      "gps-invalid";

    }

  },

  ()=>{

    alert(
      "GPS gagal diakses"
    );

  }

);

/* =========================
   DISTANCE CALCULATOR
========================= */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371;

  const dLat =
  (lat2-lat1) * Math.PI/180;

  const dLon =
  (lon2-lon1) * Math.PI/180;

  const a =

    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  const c =
  2 * Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );

  return R * c;

}

/* =========================
   UPLOAD SELFIE
========================= */

const uploadBtn =
document.getElementById(
  "uploadBtn"
);

uploadBtn.addEventListener(

  "click",

  async ()=>{

    if(!selfieTaken){

      alert(
        "Ambil foto terlebih dahulu"
      );

      return;

    }

    try{

      await authenticateGoogle();

      const canvas =
      document.getElementById(
        "snapshot"
      );

      canvas.toBlob(

        async(blob)=>{

          const file =
          new File(

            [blob],

            `selfie-${Date.now()}.jpg`,

            {
              type:"image/jpeg"
            }

          );

          await uploadFileToDrive(
            file
          );

        },

        "image/jpeg"

      );

    }catch(error){

      console.error(error);

      alert(
        "Upload gagal"
      );

    }

  }

);

/* =========================
   SUBMIT ATTENDANCE
========================= */

function submitAttendance(){

  if(!selfieTaken){

    alert(
      "Silakan ambil selfie terlebih dahulu"
    );

    return;

  }

  alert(
    "Absensi berhasil dikirim"
  );

}

/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.clear();

  window.location =
  "index.html";

}

</script>

</body>
</html>
