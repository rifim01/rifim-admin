<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance - RIFIM ERP</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase untuk simpan data absensi -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- ✅ TIDAK ADA googleapis.com/js/api.js -->
  <!-- ✅ TIDAK ADA accounts.google.com/gsi/client -->
</head>

<body>
<div class="dashboard">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/logo.png" alt="Logo" />
      <h1>RIFIM ERP</h1>
    </div>
    <nav>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="attendance.html" style="color:#ef4444;">📍 Attendance</a>
      <a href="jadwal.html">🗓 Jadwal Shift</a>
      <a href="rekap.html">📈 Rekap</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main-content">

    <div class="topbar">
      <div>
        <h2>Attendance Verification</h2>
        <div id="clock" style="color:#64748b;font-size:14px;margin-top:4px;"></div>
      </div>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="attendance-grid">

      <!-- ── SELFIE CARD ── -->
      <div class="attendance-card">
        <h2>📸 Selfie Verification</h2>

        <video id="camera" autoplay playsinline></video>
        <canvas id="snapshot" style="display:none;"></canvas>

        <!-- Preview setelah foto diambil -->
        <img id="preview-img"
          style="display:none;width:100%;border-radius:15px;margin-bottom:12px;" />

        <button class="primary-btn" onclick="takePhoto()">
          📷 Ambil Foto
        </button>

        <button id="uploadBtn" class="primary-btn"
          style="margin-top:10px;background:#15803d;" onclick="doUpload()">
          ☁️ Upload Selfie ke Drive
        </button>

        <div id="upload-status"></div>
      </div>

      <!-- ── GPS CARD ── -->
      <div class="attendance-card">
        <h2>📍 GPS Validation</h2>

        <div class="gps-info">
          <p><strong>Latitude:</strong>
            <span id="lat" style="font-family:monospace;">⏳</span></p>
          <p><strong>Longitude:</strong>
            <span id="lng" style="font-family:monospace;">⏳</span></p>
          <p><strong>Akurasi:</strong>
            <span id="accuracy">-</span> meter</p>
        </div>

        <div id="gps-status" class="gps-valid">
          ⏳ Memuat GPS...
        </div>

        <button class="primary-btn" onclick="submitAttendance()">
          🚀 Kirim Absensi
        </button>

        <div id="submit-status" style="margin-top:10px;"></div>
      </div>

    </div>
  </main>
</div>

<!-- google-drive.js BARU (tanpa gapi/OAuth) -->
<script src="google-drive.js"></script>

<script>
// ============================================================
// FIREBASE CONFIG (sama dengan index.html)
// ============================================================
const firebaseConfig = {
  apiKey:            "AIzaSyCROrmmx9cxlAeMEobuT9DAWmVuF1oZrG4",
  authDomain:        "gen-lang-client-0837778946.firebaseapp.com",
  projectId:         "gen-lang-client-0837778946",
  storageBucket:     "gen-lang-client-0837778946.firebasestorage.app",
  messagingSenderId: "984064974556",
  appId:             "1:984064974556:web:42e4771e687590b2595e19",
};

// Init Firebase (cegah double-init)
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db   = firebase.firestore();
const auth = firebase.auth();

// ============================================================
// KOORDINAT BANDARA (Hang Nadim, Batam)
// ============================================================
const AIRPORT_LAT = 1.1210;
const AIRPORT_LNG = 104.1186;
const RADIUS_KM   = 2.0;

// State
let selfieBlob = null;
let selfieFile = null;
let gpsLat     = null;
let gpsLng     = null;

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleString("id-ID", {
      weekday:"long", year:"numeric", month:"long", day:"numeric",
      hour:"2-digit", minute:"2-digit", second:"2-digit"
    });
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// AUTH GUARD
// ============================================================
auth.onAuthStateChanged(user => {
  if (!user) window.location.href = "index.html";
});

// ============================================================
// CAMERA
// ============================================================
const videoEl = document.getElementById("camera");

(async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    videoEl.srcObject = stream;
  } catch (err) {
    showStatus("upload-status",
      "❌ Kamera tidak dapat diakses — izinkan akses kamera di browser", "error");
  }
})();

// ============================================================
// AMBIL FOTO
// ============================================================
function takePhoto() {
  const canvas  = document.getElementById("snapshot");
  const ctx     = canvas.getContext("2d");

  canvas.width  = videoEl.videoWidth  || 640;
  canvas.height = videoEl.videoHeight || 480;
  ctx.drawImage(videoEl, 0, 0);

  canvas.toBlob(blob => {
    selfieBlob = blob;
    const ts   = new Date().toISOString().replace(/[:.]/g, "-");
    selfieFile = new File([blob], `selfie-${ts}.jpg`, { type:"image/jpeg" });

    // Tampilkan preview, sembunyikan video
    const preview = document.getElementById("preview-img");
    preview.src   = URL.createObjectURL(blob);
    preview.style.display = "block";
    videoEl.style.display = "none";

    showStatus("upload-status", "✅ Foto berhasil diambil — siap diupload", "success");
  }, "image/jpeg", 0.85);
}

// ============================================================
// UPLOAD KE DRIVE
// ============================================================
async function doUpload() {
  if (!selfieFile) {
    alert("⚠️ Ambil foto selfie terlebih dahulu");
    return;
  }
  await uploadFileToDrive(selfieFile); // dari google-drive.js
}

// ============================================================
// GPS
// ============================================================
navigator.geolocation.getCurrentPosition(
  pos => {
    gpsLat = pos.coords.latitude;
    gpsLng = pos.coords.longitude;
    const acc = pos.coords.accuracy;

    document.getElementById("lat").textContent      = gpsLat.toFixed(7);
    document.getElementById("lng").textContent      = gpsLng.toFixed(7);
    document.getElementById("accuracy").textContent = Math.round(acc);

    validateGPS(gpsLat, gpsLng);
  },
  err => {
    document.getElementById("gps-status").innerHTML    = "❌ GPS gagal — izinkan akses lokasi";
    document.getElementById("gps-status").className    = "";
    document.getElementById("gps-status").style.cssText =
      "background:#fee2e2;color:#991b1b;padding:14px;border-radius:12px;font-weight:600;margin-bottom:20px;";
  },
  { enableHighAccuracy: true, timeout: 15000 }
);

function validateGPS(lat, lng) {
  const dist   = haversineKm(lat, lng, AIRPORT_LAT, AIRPORT_LNG);
  const el     = document.getElementById("gps-status");
  const distTxt = dist.toFixed(2);

  if (dist <= RADIUS_KM) {
    el.className = "gps-valid";
    el.innerHTML = `✅ Dalam Radius Bandara (${distTxt} km dari bandara)`;
  } else {
    el.className = "";
    el.style.cssText =
      "background:#fee2e2;color:#991b1b;padding:14px;border-radius:12px;font-weight:600;margin-bottom:20px;";
    el.innerHTML = `❌ Di Luar Radius Bandara (${distTxt} km dari bandara)`;
  }
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dL = r(lat2-lat1), dO = r(lon2-lon1);
  const a  = Math.sin(dL/2)**2 +
             Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dO/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
const r = deg => deg * Math.PI / 180;

// ============================================================
// SUBMIT ABSENSI → SIMPAN KE FIRESTORE
// ============================================================
async function submitAttendance() {
  if (!gpsLat) {
    alert("⚠️ Tunggu GPS selesai memuat");
    return;
  }
  if (!selfieBlob) {
    alert("⚠️ Ambil foto selfie terlebih dahulu");
    return;
  }

  const user = auth.currentUser;
  if (!user) {
    alert("Sesi habis — silakan login ulang");
    window.location.href = "index.html";
    return;
  }

  showStatus("submit-status", "⏳ Menyimpan absensi...", "info");

  try {
    await db.collection("absensi").add({
      email:     user.email,
      uid:       user.uid,
      latitude:  gpsLat,
      longitude: gpsLng,
      timestamp: firebase.firestore.FieldValue.serverTimestamp(),
      status:    "hadir",
    });

    showStatus("submit-status", "✅ Absensi berhasil disimpan!", "success");
  } catch (err) {
    showStatus("submit-status", "❌ Gagal menyimpan: " + err.message, "error");
    console.error(err);
  }
}

// ============================================================
// HELPERS
// ============================================================
function showStatus(elId, msg, type) {
  const el = document.getElementById(elId);
  if (!el) return;
  const map = {
    success: ["#dcfce7","#166534"],
    error:   ["#fee2e2","#991b1b"],
    info:    ["#dbeafe","#1e40af"],
  };
  const [bg, color] = map[type] || map.info;
  el.style.cssText =
    `display:block;background:${bg};color:${color};padding:12px 16px;` +
    `border-radius:12px;font-weight:600;font-size:15px;margin-top:10px;`;
  el.textContent = msg;
}

function logout() {
  auth.signOut().then(() => {
    localStorage.clear();
    window.location.href = "index.html";
  });
}
</script>
</body>
</html>
