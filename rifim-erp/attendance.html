<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Attendance - RIFIM ERP</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <!-- GOOGLE API -->

  <script src="https://apis.google.com/js/api.js"></script>

  <script src="https://accounts.google.com/gsi/client"></script>

</head>

<body>

<div class="dashboard">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-logo">

      <img
        src="assets/logo.png"
        alt="Logo"
      />

      <h1>RIFIM ERP</h1>

    </div>

    <nav>

      <a href="dashboard.html">
        📊 Dashboard
      </a>

      <a href="attendance.html">
        📍 Attendance
      </a>

      <a href="jadwal.html">
        🗓 Jadwal Shift
      </a>

      <a href="rekap.html">
        📈 Rekap
      </a>

    </nav>

  </aside>

  <!-- MAIN -->

  <main class="main-content">

    <div class="topbar">

      <div>

        <h2>Attendance Verification</h2>

        <div id="clock"></div>

      </div>

      <button onclick="logout()">
        Logout
      </button>

    </div>

    <!-- ATTENDANCE -->

    <div class="attendance-grid">

      <!-- SELFIE -->

      <div class="attendance-card">

        <h2>
          📸 Selfie Verification
        </h2>

        <video
          id="camera"
          autoplay
          playsinline
        ></video>

        <canvas
          id="snapshot"
          style="display:none;"
        ></canvas>

        <button
          class="primary-btn"
          onclick="takePhoto()"
        >
          📷 Ambil Foto
        </button>

        <button
          id="uploadBtn"
          class="primary-btn"
        >
          🚀 Upload Selfie
        </button>

      </div>

      <!-- GPS -->

      <div class="attendance-card">

        <h2>
          📍 GPS Validation
        </h2>

        <div class="gps-info">

          <p>
            <strong>Latitude:</strong>
            <span id="lat">-</span>
          </p>

          <p>
            <strong>Longitude:</strong>
            <span id="lng">-</span>
          </p>

        </div>

        <div
          id="gps-status"
          class="gps-valid"
        >
          ⏳ Validasi GPS...
        </div>

        <button
          class="primary-btn"
          onclick="submitAttendance()"
        >
          🚀 Kirim Absensi
        </button>

      </div>

    </div>

  </main>

</div>

<!-- GOOGLE DRIVE SCRIPT -->

<script src="google-drive.js"></script>

<script>

const airportLat = 1.1433;
const airportLng = 104.0150;

let selfieBlob = null;

/* CLOCK */

function updateClock(){

  const now = new Date();

  document.getElementById(
    "clock"
  ).innerHTML =
  now.toLocaleString(
    "id-ID"
  );

}

setInterval(updateClock,1000);

updateClock();

/* CAMERA */

const camera =
document.getElementById(
  "camera"
);

async function startCamera(){

  try{

    const stream =
    await navigator.mediaDevices.getUserMedia({

      video:true

    });

    camera.srcObject =
    stream;

  }catch(err){

    alert(
      "Camera tidak tersedia"
    );

  }

}

startCamera();

/* TAKE PHOTO */

function takePhoto(){

  const canvas =
  document.getElementById(
    "snapshot"
  );

  const context =
  canvas.getContext("2d");

  canvas.width =
  camera.videoWidth;

  canvas.height =
  camera.videoHeight;

  context.drawImage(
    camera,
    0,
    0
  );

  canvas.toBlob((blob)=>{

    selfieBlob = blob;

    alert(
      "✅ Foto berhasil diambil"
    );

  },"image/jpeg");

}

/* GPS VALIDATION */

navigator.geolocation.getCurrentPosition(

  (position)=>{

    const lat =
    position.coords.latitude;

    const lng =
    position.coords.longitude;

    document.getElementById(
      "lat"
    ).innerText = lat;

    document.getElementById(
      "lng"
    ).innerText = lng;

    validateGPS(lat,lng);

  },

  ()=>{

    alert(
      "GPS gagal diakses"
    );

  }

);

function validateGPS(lat,lng){

  const distance =
  getDistanceFromLatLonInKm(
    lat,
    lng,
    airportLat,
    airportLng
  );

  const status =
  document.getElementById(
    "gps-status"
  );

  if(distance <= 1){

    status.innerHTML =
    "✅ Dalam Radius Bandara";

    status.className =
    "gps-valid";

  }else{

    status.innerHTML =
    "❌ Diluar Radius Bandara";

    status.className =
    "gps-invalid";

  }

}

function getDistanceFromLatLonInKm(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371;

  const dLat =
  deg2rad(lat2-lat1);

  const dLon =
  deg2rad(lon2-lon1);

  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(deg2rad(lat1)) *
    Math.cos(deg2rad(lat2)) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  const c =
  2 * Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1-a)
  );

  return R * c;

}

function deg2rad(deg){

  return deg * (
    Math.PI/180
  );

}

/* UPLOAD SELFIE */

document.getElementById(
  "uploadBtn"
).addEventListener(

  "click",

  async()=>{

    if(!selfieBlob){

      alert(
        "Ambil foto terlebih dahulu"
      );

      return;

    }

    const file = new File(

      [selfieBlob],

      `selfie-${Date.now()}.jpg`,

      {
        type:"image/jpeg"
      }

    );

    await uploadFileToDrive(file);

  }

);

/* SUBMIT */

function submitAttendance(){

  alert(
    "✅ Absensi berhasil dikirim"
  );

}

/* LOGOUT */

function logout(){

  localStorage.clear();

  window.location =
  "index.html";

}

</script>

</body>
</html>
